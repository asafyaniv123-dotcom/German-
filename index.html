  function addMissed(de) {
    const list = getMissedList();
    if (!list.includes(de)) { list.push(de); safeSet(missedKey(), JSON.stringify(list)); }
  }

  function removeMissed(de) {
    const list = getMissedList().filter(d => d !== de);
    safeSet(missedKey(), JSON.stringify(list));
  }

  function heAlternatives(heText) {
    const noParens = String(heText).replace(/\([^)]*\)/g, '');
    const noNote = noParens.split('—')[0];
    return noNote.split('/').map(s => s.trim()).filter(Boolean);
  }

  function normalizeHe(text) {
    return String(text).replace(/[.,!?;:"'׳״]/g, '').replace(/\s+/g, ' ').trim();
  }

  function isVocabAnswerCorrect(item, userText, dir) {
    if (dir === 'de2he') {
      const alts = heAlternatives(item.he).map(normalizeHe);
      return alts.includes(normalizeHe(userText));
    }
    return normalizeDe(userText) === normalizeDe(item.de);
  }

  function vocabCategoryList() {
    const cats = [...new Set(VOCAB.map(v => v.category || 'כללי'))];
    if (CATEGORY_ORDER.length) {
      cats.sort((a, b) => {
        const ia = CATEGORY_ORDER.indexOf(a), ib = CATEGORY_ORDER.indexOf(b);
        if (ia === -1 && ib === -1) return a.localeCompare(b, 'he');
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      });
    } else {
      cats.sort((a, b) => a.localeCompare(b, 'he'));
    }
    return cats;
  }

  function vocabQueueStateKey() { return 'delearn_vocab_queue_state'; }

  function loadAllVocabQueueStates() {
    try { return JSON.parse(safeGet(vocabQueueStateKey(), '{}')); } catch (e) { return {}; }
  }

  function saveVocabQueueState() {
    if (vocabMode !== 'quiz' && vocabMode !== 'mc') return;
    const all = loadAllVocabQueueStates();
    all[vocabMode] = {
      pool: vocabPool,
      category: vocabCategory,
      queue: vocabQueue.map(v => v.de),
      index: vocabIndex,
    };
    safeSet(vocabQueueStateKey(), JSON.stringify(all));
  }

  function buildVocabQueue() {
    const pool = getFilteredVocabPool();
    const saved = loadAllVocabQueueStates()[vocabMode];
    if (saved && saved.pool === vocabPool && saved.category === vocabCategory && saved.queue && saved.queue.length) {
      // restore where we left off, folding in any words added to the pool since then
      const poolByDe = new Map(pool.map(v => [v.de, v]));
      const savedItems = saved.queue.map(de => poolByDe.get(de)).filter(Boolean);
      const savedDeSet = new Set(saved.queue);
      const newItems = shuffleArray(pool.filter(v => !savedDeSet.has(v.de)));
      vocabQueue = savedItems.concat(newItems);
      vocabIndex = vocabQueue.length ? Math.min(saved.index, vocabQueue.length - 1) : 0;
    } else {
      vocabQueue = shuffleArray(pool);
      vocabIndex = 0;
    }
  }

  function setVocabCategory(cat) {
    vocabCategory = cat;
    safeSet('delearn_vocab_category', cat);
    buildVocabQueue();
    mcQuestionKey = null;
    if (vocabMode === 'grid') initVocabGrid();
    renderVocab();
  }

  function vocabPoolRowHtml() {
    const missedCount = getMissedList().length;
    return `
      <div class="weak-toggle-row" id="vocabPoolRow">
        <button class="nav-btn${vocabPool === 'all' ? ' active-toggle' : ''}" onclick="setVocabPool('all')">כל האוצר</button>
        <button class="nav-btn${vocabPool === 'missed' ? ' active-toggle' : ''}" onclick="setVocabPool('missed')">מה שטעיתי (${missedCount})</button>
        <button class="nav-btn${vocabPool === 'learned' ? ' active-toggle' : ''}" onclick="setVocabPool('learned')">מה שלמדתי (${getLearnedSet().size})</button>
      </div>`;
  }

  // words the person added to the 15-a-day calendar, across all days (the growing "bucket")
  function getLearnedSet() {
    try {
      const d = JSON.parse(localStorage.getItem('delearn_daywords') || '{}') || {};
      const out = new Set();
      Object.keys(d).forEach(k => (d[k] || []).forEach(id => out.add(String(id))));
      return out;
    } catch (e) { return new Set(); }
  }
  // quiz direction: 'de2he', 'he2de', or 'mix' (each question flips a coin, kept until the next question)
  let vocabMixCur = {};
  function qDir(item) {
    if (vocabDir !== 'mix') return vocabDir;
    if (!(item.de in vocabMixCur)) vocabMixCur[item.de] = Math.random() < 0.5 ? 'de2he' : 'he2de';
    return vocabMixCur[item.de];
  }
  function vocabDirLabel() { return vocabDir === 'de2he' ? '↔ גרמנית ← עברית' : vocabDir === 'he2de' ? '🔁 עברית ← גרמנית' : '🔀 ערבוב'; }

  function getFilteredVocabPool() {
    let pool = VOCAB;
    if (vocabPool === 'missed') {
      const missed = getMissedList();
      pool = pool.filter(v => missed.includes(v.de));
    }
    if (vocabPool === 'learned') {
      const learned = getLearnedSet();
      pool = pool.filter(v => learned.has(v.de));
    }
    if (vocabCategory !== 'all') {
      pool = pool.filter(v => (v.category || 'כללי') === vocabCategory);
    }
    return pool;
  }

  function drawNextGridItem() {
    const onBoard = new Set(gridCells.filter(Boolean).map(c => c.item.de));
    if (!gridPool.length) {
      const base = getFilteredVocabPool();
      if (!base.length) return null;
      gridPool = shuffleArray(base);
    }
    let idx = gridPool.findIndex(v => !onBoard.has(v.de));
    if (idx === -1) idx = 0;
    return gridPool.splice(idx, 1)[0];
  }

  function initVocabGrid() {
    gridPool = shuffleArray(getFilteredVocabPool());
    gridCells = [];
    for (let i = 0; i < 9; i++) {
      const item = drawNextGridItem();
      gridCells.push(item ? { item, dir: pickCellDir(vocabGridDir), flipped: false } : null);
    }
  }

  function setVocabGridDir(mode) {
    vocabGridDir = mode;
    safeSet('delearn_vocab_grid_dir', mode);
    initVocabGrid();
    renderVocab();
  }

  function flipGridCell(i) {
    if (!gridCells[i]) return;
    gridCells[i].flipped = !gridCells[i].flipped;
    renderVocab();
  }

  function judgeGridCell(i, isCorrect) {
    const cell = gridCells[i];
    if (!cell) return;
    recordAttempt(cell.item.de, isCorrect);
    if (isCorrect) removeMissed(cell.item.de); else addMissed(cell.item.de);
    const next = drawNextGridItem();
    gridCells[i] = next ? { item: next, dir: pickCellDir(vocabGridDir), flipped: false } : null;
    renderVocab();
  }

  function gridDirRowHtml(currentDir, setterName) {
    return `
      <div class="weak-toggle-row">
        <button class="nav-btn${currentDir === 'de2he' ? ' active-toggle' : ''}" onclick="${setterName}('de2he')">רק גרמנית</button>
        <button class="nav-btn${currentDir === 'he2de' ? ' active-toggle' : ''}" onclick="${setterName}('he2de')">רק עברית</button>
        <button class="nav-btn${currentDir === 'mixed' ? ' active-toggle' : ''}" onclick="${setterName}('mixed')">🔀 ערבוב</button>
      </div>`;
  }

  function renderVocabGridBody() {
    const poolRow = vocabPoolRowHtml();
    const categoryRow = vocabCategoryRowHtml();
    const dirRow = gridDirRowHtml(vocabGridDir, 'setVocabGridDir');
    const availableCount = getFilteredVocabPool().length;
    if (!availableCount) {
      const emptyMsg = vocabPool === 'missed'
        ? 'אין כרגע מילים לתרגול חוזר — כל הכבוד! 🎉'
        : (vocabPool === 'learned' ? 'עוד לא הוספת מילים ללוח ה-15 ביום, אז אין עוד מה לבחון.' : 'אין מילים בקטגוריה הזו.');
      return poolRow + categoryRow + dirRow + `<div class="vocab-missed-empty">${emptyMsg}</div>`;
    }
    const cellsHtml = gridCells.map((cell, i) => {
      if (!cell) return `<div class="grid-card-wrap"></div>`;
      const { item, dir, flipped } = cell;
      const frontIsDe = dir === 'de2he';
      const frontText = frontIsDe ? item.de : item.he;
      const backText = frontIsDe ? item.he : item.de;
      const speakId = `vocab-grid-speak-${i}`;
      const speakBtn = `<button class="grid-card-speak" id="${speakId}" onclick="event.stopPropagation(); speak('${escapeJs(item.de)}', '${speakId}')" aria-label="השמע בגרמנית">🔊</button>`;
      return `
        <div class="grid-card-wrap">
          <div class="grid-card${flipped ? ' flipped' : ''}" data-cell-index="${i}">
            <div class="grid-card-face grid-card-front">${frontIsDe ? speakBtn : ''}<div class="grid-card-text${frontIsDe ? ' is-de' : ''}">${escapeHtml(frontText)}</div></div>
            <div class="grid-card-face grid-card-back">${!frontIsDe ? speakBtn : ''}<div class="grid-card-text${!frontIsDe ? ' is-de' : ''}">${escapeHtml(backText)}</div>${vocabExampleMini(item.de)}</div>
          </div>
        </div>`;
    }).join('');
    return poolRow + categoryRow + dirRow + `
      <div class="vocab-grid-hint">הקישו על כרטיסייה כדי להפוך ← החליקו ימינה אם ידעתם, שמאלה אם לא →</div>
      <div class="vocab-grid-wrap" id="vocabGrid">${cellsHtml}</div>`;
  }

  function bindGridGestures(containerId, isCellFlipped, onFlip, onJudge) {
    const grid = document.getElementById(containerId);
    if (!grid) return;
    let activeCard = null, activeIndex = null, startX = 0, startY = 0, dx = 0, dragging = false, moved = false, pointerId = null;

    function isInteractive(target) {
      return !!(target.closest && target.closest('button, a'));
    }
    function onDown(e) {
      if (isInteractive(e.target)) { dragging = false; return; }
      const cardEl = e.target.closest('.grid-card');
      if (!cardEl) { dragging = false; return; }
      activeCard = cardEl;
      activeIndex = parseInt(cardEl.dataset.cellIndex, 10);
      startX = e.clientX; startY = e.clientY; dx = 0; dragging = true; moved = false;
      pointerId = e.pointerId;
      activeCard.style.transition = 'none';
      if (activeCard.setPointerCapture && pointerId !== undefined) {
        try { activeCard.setPointerCapture(pointerId); } catch (err) {}
      }
    }
    function onMove(e) {
      if (!dragging || !activeCard) return;
      dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (!moved && Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      if (!moved && Math.abs(dx) < Math.abs(dy)) { dragging = false; return; }
      moved = true;
      if (e.cancelable) e.preventDefault();
      const flipped = isCellFlipped(activeIndex);
      const rot = dx / 10;
      activeCard.style.transform = `translateX(${dx}px) rotate(${rot}deg)` + (flipped ? ' rotateY(180deg)' : '');
      const intensity = Math.min(Math.abs(dx) / 55, 1);
      const color = dx > 0 ? '76,139,90' : '161,92,77';
      activeCard.style.boxShadow = intensity > 0.03 ? `0 0 0 2px rgba(${color},${(intensity * 0.7).toFixed(2)})` : '';
    }
    function onUp(e) {
      if (!dragging || !activeCard) { dragging = false; return; }
      dragging = false;
      const card = activeCard, idx = activeIndex;
      if (card.releasePointerCapture && pointerId !== undefined) {
        try { card.releasePointerCapture(pointerId); } catch (err) {}
      }
      card.style.transition = 'transform 0.3s ease';
      const threshold = 55;
      if (moved && Math.abs(dx) > threshold) {
        const goRight = dx > 0;
        card.style.transform = `translateX(${goRight ? 500 : -500}px) rotate(${goRight ? 24 : -24}deg)`;
        card.style.opacity = '0';
        setTimeout(() => onJudge(idx, goRight), 180);
      } else if (moved) {
        const flipped = isCellFlipped(idx);
        card.style.transform = flipped ? 'rotateY(180deg)' : '';
        card.style.boxShadow = '';
      } else {
        onFlip(idx);
      }
      activeCard = null; activeIndex = null;
    }
    grid.addEventListener('pointerdown', onDown);
    grid.addEventListener('pointermove', onMove);
    grid.addEventListener('pointerup', onUp);
    grid.addEventListener('pointercancel', onUp);
  }

  function bindVocabGridGestures() {
    bindGridGestures('vocabGrid', i => !!(gridCells[i] && gridCells[i].flipped), flipGridCell, judgeGridCell);
  }

  function clearFromMissed(de) {

    renderVocab();
  }

  function submitVocabQuiz() {
    const input = document.getElementById('vocabQuizInput');
    if (!input || !vocabQueue.length) return;
    const item = vocabQueue[vocabIndex];
    const isCorrect = isVocabAnswerCorrect(item, input.value, qDir(item));

  function nextVocabQuiz() {
    if (!vocabQueue.length) return;
    vocabIndex = (vocabIndex + 1) % vocabQueue.length;
    vocabMixCur = {};

    renderVocab();

  function prevVocabQuiz() {
    if (!vocabQueue.length) return;
    vocabIndex = (vocabIndex - 1 + vocabQueue.length) % vocabQueue.length;
    vocabMixCur = {};
    saveVocabQueueState();
    renderVocab();
  }

  function generateMCOptions(item) {
    const dd = qDir(item);
    const dispText = v => dd === 'de2he' ? v.he : v.de;
    const targetText = dispText(item);
    const sameCat = shuffleArray(VOCAB.filter(v => v.category === item.category && v.de !== item.de && dispText(v) !== targetText));
    let distractors = sameCat.slice(0, 3);
    if (distractors.length < 3) {
      const usedDe = new Set([item.de, ...distractors.map(d => d.de)]);
      const usedText = new Set([targetText, ...distractors.map(dispText)]);
      const rest = shuffleArray(VOCAB.filter(v => !usedDe.has(v.de) && !usedText.has(dispText(v))));
      for (const v of rest) {
        if (distractors.length >= 3) break;
        distractors.push(v);
        usedDe.add(v.de);
      }
    }
    return shuffleArray([item, ...distractors]);
  }

  function renderVocabMCBody() {
    const poolRow = vocabPoolRowHtml();
    const categoryRow = vocabCategoryRowHtml();
    const dirRow = `
      <div class="recall-toggle-row">
        <button class="nav-btn" onclick="toggleVocabDir()">${vocabDirLabel()}</button>
      </div>`;
    if (!vocabQueue.length) {
      const emptyMsg = vocabPool === 'missed'
        ? 'אין כרגע מילים לתרגול חוזר — כל הכבוד! 🎉'
        : (vocabPool === 'learned' ? 'עוד לא הוספת מילים ללוח ה-15 ביום, אז אין עוד מה לבחון.' : 'אין מילים בקטגוריה הזו.');
      return poolRow + categoryRow + dirRow + `<div class="vocab-missed-empty">${emptyMsg}</div>`;
    }
    if (vocabIndex >= vocabQueue.length) vocabIndex = 0;
    if (vocabIndex < 0) vocabIndex = vocabQueue.length - 1;
    const item = vocabQueue[vocabIndex];
    const isDePrompt = qDir(item) === 'de2he';
    const promptText = isDePrompt ? item.de : item.he;
    const key = item.de + '|' + qDir(item);
    if (mcQuestionKey !== key) {
      mcOptions = generateMCOptions(item);
      mcQuestionKey = key;
      mcAnswered = false;
      mcSelectedDe = null;
    }
    const dispText = v => isDePrompt ? v.he : v.de;
    const answerIsHebrew = isDePrompt;
    const optionsHtml = mcOptions.map(opt => {
      const isCorrectOpt = opt.de === item.de;
      let cls = 'mc-option';
      if (mcAnswered && isCorrectOpt) cls += ' mc-correct';
      else if (mcAnswered && opt.de === mcSelectedDe) cls += ' mc-wrong';
      return `<button class="${cls}" dir="${answerIsHebrew ? 'rtl' : 'ltr'}" ${mcAnswered ? 'disabled' : ''} onclick="selectMCOption('${escapeJs(opt.de)}')">${escapeHtml(dispText(opt))}</button>`;
    }).join('');
    let resultHtml = '';
    if (mcAnswered) {
      resultHtml = mcSelectedDe === item.de
        ? `<div class="check-result-correct">✓ נכון!</div>`
        : `<div class="check-result-wrong">✗ לא בדיוק</div>`;
      resultHtml += vocabNoteResultHtml(item.de);
    }
    return poolRow + categoryRow + dirRow + `
      <div class="flashcard-counter">${vocabIndex + 1} / ${vocabQueue.length}</div>
      <div class="check-card">
        <div class="vocab-quiz-top-row">
          <button class="play-btn" id="vocab-mc-play-btn" onclick="speak('${escapeJs(item.de)}', 'vocab-mc-play-btn')" aria-label="השמע בגרמנית">🔊</button>
        </div>
        <div class="vocab-quiz-prompt${isDePrompt ? ' is-de' : ''}">${escapeHtml(promptText)}</div>
        ${item.pos ? `<div class="vocab-quiz-pos">${escapeHtml(item.pos)}${item.gender ? ' · ' + escapeHtml(item.gender) : ''}</div>` : ''}
        <div class="mc-options">${optionsHtml}</div>
        <div class="check-result" id="vocabMCResult">${resultHtml}</div>
      </div>
      <div class="flashcard-nav">
        <button class="nav-btn" onclick="prevVocabQuiz()">‹ הקודם</button>
        <button class="nav-btn" onclick="nextVocabQuiz()">הבא ›</button>
      </div>`;
  }

  function selectMCOption(de) {
    if (mcAnswered || !vocabQueue.length) return;
    const item = vocabQueue[vocabIndex];
    const isCorrect = de === item.de;
    mcAnswered = true;
    mcSelectedDe = de;
    recordAttempt(item.de, isCorrect);
    if (isCorrect) { removeMissed(item.de); } else { addMissed(item.de); }
    const poolBtn = document.querySelector('#vocabPoolRow .nav-btn:nth-child(2)');
    if (poolBtn) poolBtn.textContent = `מה שטעיתי (${getMissedList().length})`;
    renderVocab();
    if (isCorrect) {
      setTimeout(() => {
        if (vocabMode === 'mc' && mcAnswered && mcSelectedDe === de) nextVocabQuiz();
      }, 700);
    }
  }

  function vocabRowHtml(v, rowId) {
    const starHtml = hasNote(v.de) ? '<span class="assoc-star">★</span>' : '';
    return `
      <div class="vocab-row">
        <div class="vocab-main">
          <div class="vocab-de" onclick="toggleNote('${rowId}', '${escapeJs(v.de)}')">${escapeHtml(v.de)}${v.pos ? `<span class="vocab-pos">${escapeHtml(v.pos)}</span>` : ''}${starHtml}</div>
          <div class="vocab-he">${escapeHtml(v.he)}</div>${v.hint ? `<div class="vocab-hint">💡 ${escapeHtml(v.hint)}</div>` : ''}
          <div class="ext-links">
            <a class="ext-link" href="${forvoUrl(v.de)}" target="_blank" rel="noopener noreferrer">Forvo</a>
            <a class="ext-link" href="${tatoebaUrl(v.de)}" target="_blank" rel="noopener noreferrer">Tatoeba</a>
          </div>
          <div class="note-panel" id="note-${rowId}" style="display:none;"></div>
        </div>
        <button class="play-btn" id="${rowId}" onclick="speak('${escapeJs(v.de)}', '${rowId}')" aria-label="השמע בגרמנית">🔊</button>
      </div>`;
  }

  function renderVocab() {
    const el = document.getElementById('view-vocab');
    if (VOCAB.length === 0) {
      el.innerHTML = `<div class="empty"><span class="empty-emoji">✎</span>עדיין אין כאן מילים.<br>ברגע שיגיעו משפטים חדשים, המילים החדשות שבהם יופיעו כאן לפי הסדר האלפביתי.</div>`;
      return;
    }
    const modeRow = `
      <div class="weak-toggle-row" id="vocabModeRow">
        <button class="nav-btn${vocabMode === 'list' ? ' active-toggle' : ''}" onclick="setVocabMode('list')">רשימה</button>
        <button class="nav-btn${vocabMode === 'quiz' ? ' active-toggle' : ''}" onclick="setVocabMode('quiz')">מבחן</button>
        <button class="nav-btn${vocabMode === 'mc' ? ' active-toggle' : ''}" onclick="setVocabMode('mc')">בחירה מרובה</button>
        <button class="nav-btn${vocabMode === 'grid' ? ' active-toggle' : ''}" onclick="setVocabMode('grid')">רשת</button>
        <button class="nav-btn${vocabMode === 'mnemonic' ? ' active-toggle' : ''}" onclick="setVocabMode('mnemonic')">שינון</button>
        <button class="nav-btn" onclick="openGermanSpeak()">🎤 דיבור</button>
        <button class="nav-btn" onclick="openBowls()">🥣 קערות</button>
        <button class="nav-btn" onclick="openDaily()">📅 15 ביום</button>
      </div>`;
    if (vocabMode === 'mnemonic') {
      el.innerHTML = modeRow + renderMnemonicBody();
      return;
    }
    if (vocabMode === 'quiz') {
      el.innerHTML = modeRow + renderVocabQuizBody();
      bindVocabQuizInput();
      return;
    }
    if (vocabMode === 'mc') {
      el.innerHTML = modeRow + renderVocabMCBody();
      return;
    }
    if (vocabMode === 'grid') {
      if (!gridCells.length) initVocabGrid();
      el.innerHTML = modeRow + renderVocabGridBody();
      bindVocabGridGestures();
      return;
    }
    const listViewRow = `
      <div class="weak-toggle-row" id="vocabListViewRow">
        <button class="nav-btn${vocabListView === 'alpha' ? ' active-toggle' : ''}" onclick="setVocabListView('alpha')">לפי א-ב</button>
        <button class="nav-btn${vocabListView === 'category' ? ' active-toggle' : ''}" onclick="setVocabListView('category')">לפי קטגוריה</button>
        <button class="nav-btn${vocabListView === 'recent' ? ' active-toggle' : ''}" onclick="setVocabListView('recent')">הכי חדשים</button>
      </div>`;
    let listHtml;
    if (vocabListView === 'recent') {
      const items = [...VOCAB].reverse();
      const rows = items.map((v, i) => vocabRowHtml(v, `v-recent-${i}`)).join('');
      listHtml = `<div class="category">${rows}</div>`;
    } else if (vocabListView === 'category') {
      const groups = {};
      VOCAB.forEach(v => {
        const cat = v.category || 'כללי';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(v);
      });
      let catNames = Object.keys(groups);
      if (CATEGORY_ORDER.length) {
        catNames.sort((a, b) => {
          const ia = CATEGORY_ORDER.indexOf(a), ib = CATEGORY_ORDER.indexOf(b);
          if (ia === -1 && ib === -1) return a.localeCompare(b, 'he');
          if (ia === -1) return 1;
          if (ib === -1) return -1;
          return ia - ib;
        });
      } else {
        catNames.sort((a, b) => a.localeCompare(b, 'he'));
      }
      listHtml = catNames.map(cat => {
        const idx = tagIndexFor(cat);
        const items = [...groups[cat]].sort((a, b) => a.de.localeCompare(b.de, 'de'));
        const safeCat = cat.replace(/[^a-zA-Z0-9-]/g, '_');
        const rows = items.map((v, i) => vocabRowHtml(v, `v-${safeCat}-${i}`)).join('');
        return `<div class="category"><span class="category-title" style="background:var(--tag-${idx + 1}-bg); color:var(--tag-${idx + 1});">${escapeHtml(cat)}</span>${rows}</div>`;
      }).join('');
    } else {
      const sorted = [...VOCAB].sort((a, b) => a.de.localeCompare(b.de, 'de'));
      const groups = {};
      sorted.forEach(v => {
        let letter = v.de[0].toUpperCase();
        if ('ÄÖÜ'.includes(letter)) letter = { 'Ä':'A','Ö':'O','Ü':'U' }[letter];
        if (!groups[letter]) groups[letter] = [];
        groups[letter].push(v);
      });
      listHtml = Object.keys(groups).sort((a,b) => a.localeCompare(b,'de')).map(letter => {
        const rows = groups[letter].map((v, i) => vocabRowHtml(v, `v-${letter}-${i}`)).join('');
        return `<div class="letter-group"><div class="letter-heading">${letter}</div>${rows}</div>`;
      }).join('');
    }
    el.innerHTML = modeRow + listViewRow + listHtml;
  }

  let flowSortMode = safeGet('delearn_flow_sort', 'category');

  function setFlowSortMode(mode) {
    flowSortMode = mode;
    safeSet('delearn_flow_sort', mode);
    renderFlow();
  }

  function flowItemHtml(s, sIdx, showCategoryBadge, idPrefix) {
    idPrefix = idPrefix || '';
    const rowId = `${idPrefix}flow-play-${sIdx}`;
    const nodes = (s.flow && s.flow.length) ? s.flow : s.de.split(' ').map(w => ({ text: w, label: '', type: 'other', he: '' }));
    const nodesHtml = nodes.map((n, ni) => {
      const wordBtnId = `${idPrefix}flow-word-${sIdx}-${ni}`;
      return (ni > 0 ? '<span class="flow-arrow">→</span>' : '') +
      `<div class="flow-node" onclick="this.classList.toggle('flipped')">
        <div class="flow-node-front flow-${n.type || 'other'}">
          <div class="flow-de">${escapeHtml(n.text)}<button class="flow-speak-btn" id="${wordBtnId}" onclick="event.stopPropagation(); speak('${escapeJs(n.text)}', '${wordBtnId}')" aria-label="השמע בגרמנית">🔊</button></div>
          ${n.label ? `<div class="flow-label">${escapeHtml(n.label)}</div>` : ''}
        </div>
        <div class="flow-node-back">
          <div class="flow-translation">${escapeHtml(n.he || n.label || '')}</div>
        </div>
      </div>`;
    }).join('');
    let catBadge = '';
    if (showCategoryBadge) {
      const cat = s.category || 'כללי';
      const idx = tagIndexFor(cat);
      catBadge = `<span class="flow-item-cat" style="background:var(--tag-${idx + 1}-bg); color:var(--tag-${idx + 1});">${escapeHtml(cat)}</span>`;
    }
    return `
      <div class="flow-item" id="${idPrefix}flow-item-${sIdx}">
        <div class="flow-item-top">
          ${catBadge}
          <div class="flow-he">${escapeHtml(s.he)}</div>
          <button class="play-btn" id="${rowId}" onclick="speak('${escapeJs(s.de)}', '${rowId}')" aria-label="השמע בגרמנית">🔊</button>
        </div>
        <div class="flow-wrap">${nodesHtml}</div>
      </div>`;
  }

  function renderFlow() {
    const el = document.getElementById('view-flow');
    if (SENTENCES.length === 0) {
      el.innerHTML = `<div class="empty"><span class="empty-emoji">✎</span>עדיין אין כאן משפטים.<br>ברגע שיתווספו משפטים, יופיעו כאן תרשימי הזרימה שלהם.</div>`;
      return;
    }
    const legend = `
      <div class="flow-back-row" id="flowBackRow">
        <button class="nav-btn" onclick="switchTab('flashcards')">‹ חזרה לכרטיסיות</button>
      </div>
      <div class="flow-legend">
        <span class="legend-item"><span class="legend-swatch flow-pron"></span>כינוי גוף</span>
        <span class="legend-item"><span class="legend-swatch flow-verb"></span>פועל</span>
        <span class="legend-item"><span class="legend-swatch flow-modal"></span>פועל מודלי</span>
        <span class="legend-item"><span class="legend-swatch flow-refl"></span>רפלקסיבי / מושא</span>
      </div>`;
    const sortRow = `
      <div class="weak-toggle-row" id="flowSortRow">
        <button class="nav-btn${flowSortMode === 'category' ? ' active-toggle' : ''}" onclick="setFlowSortMode('category')">לפי קטגוריה</button>
        <button class="nav-btn${flowSortMode === 'recent' ? ' active-toggle' : ''}" onclick="setFlowSortMode('recent')">הכי חדשים קודם</button>
      </div>`;
    let body;
    if (flowSortMode === 'recent') {
      const indexed = SENTENCES.map((s, sIdx) => ({ s, sIdx })).reverse();
      body = indexed.map(({ s, sIdx }) => flowItemHtml(s, sIdx, true)).join('');
    } else {
      const categories = {};
      SENTENCES.forEach(s => {
        const cat = s.category || 'כללי';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(s);
      });
      let catNames = Object.keys(categories);
      if (CATEGORY_ORDER.length) {
        catNames.sort((a, b) => {
          const ia = CATEGORY_ORDER.indexOf(a), ib = CATEGORY_ORDER.indexOf(b);
          if (ia === -1 && ib === -1) return a.localeCompare(b, 'he');
          if (ia === -1) return 1;
          if (ib === -1) return -1;
          return ia - ib;
        });
      } else {
        catNames.sort((a, b) => a.localeCompare(b, 'he'));
      }
      body = catNames.map(cat => {
        const idx = tagIndexFor(cat);
        const items = categories[cat].map(s => flowItemHtml(s, SENTENCES.indexOf(s), false)).join('');
        return `<div class="category"><span class="category-title" style="background:var(--tag-${idx + 1}-bg); color:var(--tag-${idx + 1});">${escapeHtml(cat)}</span>${items}</div>`;
      }).join('');
    }
    el.innerHTML = legend + sortRow + body;
  }

  let flashFlipped = false;

  let recallMode = safeGet('delearn_recall_mode', '0') === '1';

  let flashShuffled = safeGet('delearn_flash_shuffled', '0') === '1';

  let flashDeck = [];

  let flashSessionQueue = [];

  let flashSessionPos = 0;

  let flashSessionCorrect = [];

  let flashSessionReview = [];

  let flashSessionDone = false;

  let flashViewMode = safeGet('delearn_flash_view_mode', 'single');

  let flashGridCells = [];

  let flashGridPool = [];

  let flashGridDir = safeGet('delearn_flash_grid_dir', 'mixed');

  function toggleRecallMode() {
    recallMode = !recallMode;
    flashFlipped = false;
    safeSet('delearn_recall_mode', recallMode ? '1' : '0');
    renderFlashcards();
  }

  function getFlashOrder() {
    if (!flashShuffled) return getOrderedSentences();
    if (!flashDeck.length) flashDeck = shuffleArray(getOrderedSentences());
    return flashDeck;
  }

  function setFlashOrder(shuffled) {
    flashShuffled = shuffled;
    safeSet('delearn_flash_shuffled', shuffled ? '1' : '0');
    if (shuffled) flashDeck = shuffleArray(getOrderedSentences());
    startFlashSession(getFlashOrder());
  }

  function getOrderedSentences() {
    const categories = {};
    SENTENCES.forEach(s => {
      const cat = s.category || 'כללי';
      if (!categories[cat]) categories[cat] = [];
      categories[cat].push(s);
    });
    let catNames = Object.keys(categories);
    if (CATEGORY_ORDER.length) {
      catNames.sort((a, b) => {
        const ia = CATEGORY_ORDER.indexOf(a), ib = CATEGORY_ORDER.indexOf(b);
        if (ia === -1 && ib === -1) return a.localeCompare(b, 'he');
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      });
    } else {
      catNames.sort((a, b) => a.localeCompare(b, 'he'));
    }
    const ordered = [];
    catNames.forEach(cat => categories[cat].forEach(s => ordered.push(s)));
    return ordered;
  }

  function startFlashSession(deck) {
    flashSessionQueue = deck.slice();
    flashSessionPos = 0;
    flashSessionCorrect = [];
    flashSessionReview = [];
    flashSessionDone = flashSessionQueue.length === 0;
    flashFlipped = false;
    renderFlashcards();
  }

  function renderFlashcards() {
    const el = document.getElementById('view-flashcards');
    const viewModeRow = `
      <div class="weak-toggle-row flash-grid-mode-row" id="flashViewModeRow">
        <button class="nav-btn${flashViewMode === 'single' ? ' active-toggle' : ''}" onclick="setFlashViewMode('single')">כרטיסייה אחת</button>
        <button class="nav-btn${flashViewMode === 'grid' ? ' active-toggle' : ''}" onclick="setFlashViewMode('grid')">רשת (9)</button>
      </div>`;
    if (flashViewMode === 'grid') {
      el.innerHTML = viewModeRow + renderFlashGridBody();
      bindFlashGridGestures();
      return;
    }
    if (!flashSessionQueue.length && !flashSessionDone) {
      const deck = getFlashOrder();
      if (deck.length === 0) {
        el.innerHTML = viewModeRow + `<div class="empty"><span class="empty-emoji">✎</span>עדיין אין כאן משפטים ללימוד.<br>ברגע שיתווספו משפטים, הם יופיעו כאן ככרטיסיות.</div>`;
        return;
      }
      flashSessionQueue = deck.slice();
    }
    const controls = viewModeRow + `
      <div class="recall-toggle-row">
        <button class="nav-btn" onclick="toggleRecallMode()">${recallMode ? '🔁 שליפה פעילה: עברית → גרמנית' : '↔ מצב רגיל: גרמנית → עברית'}</button>
      </div>
      <div class="flash-order-row">
        <button class="nav-btn${!flashShuffled ? ' active-toggle' : ''}" onclick="setFlashOrder(false)">לפי קטגוריה</button>
        <button class="nav-btn${flashShuffled ? ' active-toggle' : ''}" onclick="setFlashOrder(true)">🔀 מעורבב</button>
      </div>`;

    if (flashSessionDone) {
      const total = flashSessionCorrect.length + flashSessionReview.length;
      const reviewBtn = flashSessionReview.length
        ? `<button class="nav-btn" onclick="startFlashSession(flashSessionReview)">עבור שוב על מה שצריך חזרה (${flashSessionReview.length})</button>`
        : '';
      el.innerHTML = controls + `
        <div class="streak-gameover">
          <div class="streak-gameover-title" style="color:#4C8B5A;">סיימת את החפיסה! 🎉</div>
          <div class="streak-scores">
            <div class="streak-score-item"><div class="streak-score-num">${flashSessionCorrect.length}</div><div class="streak-score-label">ידעת</div></div>
            <div class="streak-score-item"><div class="streak-score-num">${flashSessionReview.length}</div><div class="streak-score-label">לחזרה</div></div>
          </div>
          <div class="check-actions" style="margin-top:6px;">
            <button class="nav-btn" onclick="startFlashSession(getFlashOrder())">התחל מחדש</button>
            ${reviewBtn}
          </div>
        </div>`;
      return;
    }

    const s = flashSessionQueue[flashSessionPos];
    const sIdx = (s.kind === 'vocab') ? -1 : SENTENCES.findIndex(x => x.de === s.de);
    const flowBtn = sIdx !== -1 ? `<button class="flow-link-btn" onclick="event.stopPropagation(); goToFlowDiagram(${sIdx})" aria-label="פתח בתרשים זרימה">📊</button>` : '';
    const frontHtml = recallMode
      ? `<div class="flashcard-category">${escapeHtml(s.category || 'כללי')}${flowBtn}</div>
         <div class="flashcard-he">${escapeHtml(s.he)}</div>
         <div class="flashcard-hint">נסה/י לומר בקול בגרמנית, ואז הקישו כדי לראות</div>`
      : `<div class="flashcard-category">${escapeHtml(s.category || 'כללי')}${flowBtn}</div>
         <div class="flashcard-de">${escapeHtml(s.de)}</div>
         <button class="play-btn" id="flash-play-btn" onclick="event.stopPropagation(); speak('${escapeJs(s.de)}', 'flash-play-btn')" aria-label="השמע בגרמנית">🔊</button>
         <div class="flashcard-hint">הקישו כדי לראות את התרגום</div>`;
    const backHtml = recallMode
      ? `<div class="flashcard-de">${escapeHtml(s.de)}</div>
         <button class="play-btn" id="flash-play-btn-back" onclick="event.stopPropagation(); speak('${escapeJs(s.de)}', 'flash-play-btn-back')" aria-label="השמע בגרמנית">🔊</button>`
      : `<div class="flashcard-he">${escapeHtml(s.he)}</div>`;

    el.innerHTML = controls + `
      <div class="flashcard-counter">${flashSessionPos + 1} / ${flashSessionQueue.length} · ✓ ${flashSessionCorrect.length} · ↺ ${flashSessionReview.length}</div>
      <div class="flashcard-wrap">
        <div class="flashcard${flashFlipped ? ' flipped' : ''}" id="flashcard">
          <div class="flashcard-face flashcard-front">${frontHtml}</div>
          <div class="flashcard-face flashcard-back">${backHtml}</div>
        </div>
      </div>
      <div class="swipe-hint">
        <span class="hint-yes">✓ ידעתי ›</span>
        <span>הקישו כדי להפוך</span>
        <span class="hint-no">‹ ✗ לא ידעתי</span>
      </div>
      <div class="flashcard-nav">
        <button class="nav-btn judge-yes" onclick="judgeCard(true)">✓ ידעתי</button>
        <button class="nav-btn judge-no" onclick="judgeCard(false)">✗ לחזרה</button>
      </div>`;
    bindFlashSwipe();
  }

  function judgeCard(isCorrect) {
    const s = flashSessionQueue[flashSessionPos];
    if (!s) return;
    recordAttempt(s.de, isCorrect);
    renderProgress();
    if (isCorrect) flashSessionCorrect.push(s); else flashSessionReview.push(s);
    flashSessionPos++;
    flashFlipped = false;
    if (flashSessionPos >= flashSessionQueue.length) flashSessionDone = true;
    renderFlashcards();
  }

  function flipCard() {
    const card = document.getElementById('flashcard');
    if (!card) return;
    flashFlipped = !flashFlipped;
    card.style.transform = '';
    card.classList.toggle('flipped', flashFlipped);
  }

  function setFlashViewMode(mode) {
    flashViewMode = mode;
    safeSet('delearn_flash_view_mode', mode);
    if (mode === 'grid' && !flashGridCells.length) initFlashGrid();
    renderFlashcards();
  }

  function drawNextFlashGridItem() {
    const onBoard = new Set(flashGridCells.filter(Boolean).map(c => c.item.de));
    if (!flashGridPool.length) {
      if (!SENTENCES.length) return null;
      flashGridPool = shuffleArray(SENTENCES);
    }
    let idx = flashGridPool.findIndex(s => !onBoard.has(s.de));
    if (idx === -1) idx = 0;
    return flashGridPool.splice(idx, 1)[0];
  }

  function initFlashGrid() {
    flashGridPool = shuffleArray(SENTENCES);
    flashGridCells = [];
    for (let i = 0; i < 9; i++) {
      const item = drawNextFlashGridItem();
      flashGridCells.push(item ? { item, dir: pickCellDir(flashGridDir), flipped: false } : null);
    }
  }

  function setFlashGridDir(mode) {
    flashGridDir = mode;
    safeSet('delearn_flash_grid_dir', mode);
    initFlashGrid();
    renderFlashcards();
  }

  function flipFlashGridCell(i) {
    if (!flashGridCells[i]) return;
    flashGridCells[i].flipped = !flashGridCells[i].flipped;
    renderFlashcards();
  }

  function judgeFlashGridCell(i, isCorrect) {
    const cell = flashGridCells[i];
    if (!cell) return;
    recordAttempt(cell.item.de, isCorrect);
    renderProgress();
    const next = drawNextFlashGridItem();

  function bindFlashSwipe() {
    const card = document.getElementById('flashcard');
    if (!card) return;
    card.style.touchAction = 'none';
    let startX = 0, startY = 0, dx = 0, dragging = false, moved = false, pointerId = null;

    function isInteractive(target) {
      return !!(target.closest && target.closest('button, a'));
    }

    function onDown(e) {
      if (isInteractive(e.target)) { dragging = false; return; }
      startX = e.clientX; startY = e.clientY; dx = 0; dragging = true; moved = false;
      pointerId = e.pointerId;
      card.style.transition = 'none';
      if (card.setPointerCapture && pointerId !== undefined) {
        try { card.setPointerCapture(pointerId); } catch (err) {}
      }
    }
    function onMove(e) {
      if (!dragging) return;
      dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (!moved && Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (!moved && Math.abs(dx) < Math.abs(dy)) { dragging = false; return; }
      moved = true;
      if (e.cancelable) e.preventDefault();
      const rot = dx / 14;
      card.style.transform = `translateX(${dx}px) rotate(${rot}deg)` + (flashFlipped ? ' rotateY(180deg)' : '');
      const intensity = Math.min(Math.abs(dx) / 90, 1);
      const color = dx > 0 ? '76,139,90' : '161,92,77';
      card.style.boxShadow = intensity > 0.03 ? `0 0 0 3px rgba(${color},${(intensity * 0.7).toFixed(2)})` : '';
    }
    function onUp(e) {
      if (!dragging) { return; }
      dragging = false;
      if (card.releasePointerCapture && pointerId !== undefined) {
        try { card.releasePointerCapture(pointerId); } catch (err) {}
      }
      card.style.transition = 'transform 0.3s ease';
      const threshold = 90;
      if (moved && Math.abs(dx) > threshold) {
        const goRight = dx > 0;
        card.style.transform = `translateX(${goRight ? 700 : -700}px) rotate(${goRight ? 28 : -28}deg)`;
        setTimeout(() => judgeCard(goRight), 180);
      } else if (moved) {
        card.style.transform = flashFlipped ? 'rotateY(180deg)' : '';
        card.style.boxShadow = '';
      } else {
        flipCard();
      }
    }
    card.addEventListener('pointerdown', onDown);
    card.addEventListener('pointermove', onMove);
    card.addEventListener('pointerup', onUp);
    card.addEventListener('pointercancel', onUp);
  }

  function playSequenceStep() {
    if (!sequencePlaying) return;
    if (sequencePos >= sequenceOrder.length) { stopSequence(); return; }
    const s = sequenceOrder[sequencePos];
    const status = document.getElementById('sequenceStatus');
    if (status) status.textContent = (sequencePos + 1) + ' / ' + sequenceOrder.length;
    const utter = new SpeechSynthesisUtterance(s.de);
    utter.lang = 'de-DE';
    const voice = getSelectedVoice();
    if (voice) utter.voice = voice;
    utter.rate = currentRate;
    utter.volume = 1;
    utter.onend = () => {
      if (!sequencePlaying) return;
      sequencePos++;
      setTimeout(playSequenceStep, 900);
    };
    utter.onerror = () => {

      sequencePos++;
      setTimeout(playSequenceStep, 300);
    };
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);

  function normalizeDe(text) {

  function diffMissingNodes(userText, flowNodes) {
    if (!flowNodes || !flowNodes.length) return [];
    const userTokens = normalizeDe(userText).split(' ').filter(Boolean);
    return flowNodes.filter(n => {
      const expectedTokens = normalizeDe(n.text).split(' ').filter(Boolean);
      return !expectedTokens.every(t => userTokens.includes(t));
    });
  }

  function statKey(de) {
    return 'delearn_stat_' + encodeURIComponent(normalizeDe(de));
  }

  function getStat(de) {
    const raw = safeGet(statKey(de), null);
    if (!raw) return { correct: 0, wrong: 0 };
    try { return JSON.parse(raw); } catch (e) { return { correct: 0, wrong: 0 }; }
  }

  function recordAttempt(de, isCorrect) {
    const stat = getStat(de);
    if (isCorrect) stat.correct++; else stat.wrong++;
    try { localStorage.setItem(statKey(de), JSON.stringify(stat)); } catch (e) {}
    try { if (window.wordLogAttempt) window.wordLogAttempt(de, !!isCorrect); } catch (e) {}
  }

  function masteryRatio(stat) {
    const total = stat.correct + stat.wrong;
    return total === 0 ? null : stat.correct / total;
  }

  function masteryClass(ratio) {
    if (ratio === null) return 'new';
    if (ratio >= 0.8) return 'mastered';
    if (ratio >= 0.4) return 'progressing';
    return 'weak';
  }

  function masteryLabel(ratio, stat) {
    if (ratio === null) return 'טרם נבדק';
    return `${stat.correct}/${stat.correct + stat.wrong} נכון (${Math.round(ratio * 100)}%)`;
  }

  function buildDailyFocusDeck(size) {
    size = size || 10;
    const vocabItems = VOCAB.map((v, i) => ({ ...v, kind: 'vocab', _orderFrac: VOCAB.length > 1 ? i / (VOCAB.length - 1) : 1 }));
    const sentItems = SENTENCES.map((s, i) => ({ ...s, kind: 'sentence', _orderFrac: SENTENCES.length > 1 ? i / (SENTENCES.length - 1) : 1 }));
    const pool = vocabItems.concat(sentItems);
    const withStats = pool.map(item => {
      const stat = getStat(item.de);
      return { item, ratio: masteryRatio(stat), attempts: stat.correct + stat.wrong };
    });
    const weak = withStats.filter(x => x.ratio !== null && x.ratio < 0.4).sort((a, b) => a.ratio - b.ratio);
    const progressing = withStats.filter(x => x.ratio !== null && x.ratio >= 0.4 && x.ratio < 0.8).sort((a, b) => a.attempts - b.attempts);
    const mastered = withStats.filter(x => x.ratio !== null && x.ratio >= 0.8);
    const fresh = withStats.filter(x => x.ratio === null).sort((a, b) => b.item._orderFrac - a.item._orderFrac);

    const picked = [];
    const pickFrom = (arr, n) => {
      for (let i = 0; i < arr.length && picked.length < size && n > 0; i++, n--) picked.push(arr[i].item);
    };
    pickFrom(weak, Math.ceil(size * 0.4));
    pickFrom(fresh, Math.ceil(size * 0.3));
    pickFrom(progressing, Math.ceil(size * 0.3));
    if (picked.length < size) {
      const usedDe = new Set(picked.map(p => p.de));
      const rest = shuffleArray(mastered.filter(x => !usedDe.has(x.item.de)).map(x => x.item));
      for (const it of rest) { if (picked.length >= size) break; picked.push(it); }
    }
    if (picked.length < size) {
      const usedDe = new Set(picked.map(p => p.de));
      const leftover = shuffleArray(pool.filter(p => !usedDe.has(p.de)));
      for (const it of leftover) { if (picked.length >= size) break; picked.push(it); }
    }
    return shuffleArray(picked);
  }

  function startDailyFocus() {

      return;

    const withStats = ordered.map(s => ({ s, stat: getStat(s.de) }));
    withStats.sort((a, b) => {
      const ra = masteryRatio(a.stat), rb = masteryRatio(b.stat);
      const va = ra === null ? -1 : ra, vb = rb === null ? -1 : rb;
      return va - vb;
    });
    const legend = `

  function exportNotes() {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('delearn_note_')) {
          const word = decodeURIComponent(key.replace('delearn_note_', ''));
          const note = localStorage.getItem(key);
          out.push('### ' + word + '\n' + note);
        }
      }
    } catch (e) {}
    return out.join('\n\n');
  }

  function importNotes(text) {
    let count = 0;
    const blocks = text.split(/^###\s+/m).map(b => b.trim()).filter(Boolean);
    blocks.forEach(block => {
      const lines = block.split('\n');
      const word = lines[0].trim();
      const note = lines.slice(1).join('\n').trim();
      if (word && note) {
        try { localStorage.setItem(noteKey(word), note); count++; } catch (e) {}
      }
    });
    return count;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function escapeJs(str) {
    return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }

  function forvoUrl(word) {
    const slug = word.trim().toLowerCase().replace(/\s+/g, '_');

  let germanVoices = [];

  function safeGet(key, fallback) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : v; }

  function safeSet(key, value) {

  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function shuffleDiffers(arr) {
    if (arr.length <= 1) return arr.slice();
    let shuffled = shuffleArray(arr);
    let tries = 0;
    const same = a => a.every((item, i) => item.text === arr[i].text);
    while (same(shuffled) && tries < 8) {
      shuffled = shuffleArray(arr);
      tries++;
    }
    if (same(shuffled)) { // fallback: force a swap of the first two
      [shuffled[0], shuffled[1]] = [shuffled[1], shuffled[0]];
    }
    return shuffled;
  }

  function pickRandomDifferent(list, avoidItem) {
    if (!list.length) return null;
    if (list.length === 1) return list[0];
    let pick = list[Math.floor(Math.random() * list.length)];
    let tries = 0;
    while (avoidItem && pick.de === avoidItem.de && tries < 8) {
      pick = list[Math.floor(Math.random() * list.length)];
      tries++;
    }
    return pick;
  }

  function flipMemoryCard(cardId) {
    if (memoryBusy) return;
    const card = memoryCards.find(c => c.cardId === cardId);
    if (!card || memorySolved.includes(card.pairId) || memoryFlipped.includes(cardId)) return;
    memoryFlipped.push(cardId);
    if (memoryFlipped.length === 2) {
      memoryMoves++;
      const [a, b] = memoryFlipped.map(id => memoryCards.find(c => c.cardId === id));
      if (a.pairId === b.pairId) {
        memorySolved.push(a.pairId);
        memoryFlipped = [];
        renderGames();
      } else {
        memoryBusy = true;
        renderGames();
        setTimeout(() => {

  function pickWeightedSentence(avoidItem) {
    const ordered = getOrderedSentences();
    if (!ordered.length) return null;
    const pickOnce = () => {
      const weights = ordered.map(s => {
        const ratio = masteryRatio(getStat(s.de));
        return (ratio === null ? 1 : (1 - ratio)) + 0.1;
      });
      const total = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (let i = 0; i < ordered.length; i++) {
        r -= weights[i];
        if (r <= 0) return ordered[i];
      }
      return ordered[ordered.length - 1];
    };
    let pick = pickOnce();
    let tries = 0;
    while (ordered.length > 1 && avoidItem && pick.de === avoidItem.de && tries < 8) {
      pick = pickOnce();
      tries++;
    }
    return pick;
  }

  function renderStreakGameHtml() {
    if (!streakTarget && !streakGameOver) streakTarget = pickWeightedSentence(streakTarget);
    if (!streakTarget) return `<div class="empty"><span class="empty-emoji">✎</span>עדיין אין כאן משפטים למרתון.</div>`;
    const scores = `
      <div class="streak-scores">
        <div class="streak-score-item"><div class="streak-score-num">${streakCurrent}</div><div class="streak-score-label">רצף נוכחי</div></div>
        <div class="streak-score-item"><div class="streak-score-num">${streakBest}</div><div class="streak-score-label">שיא אישי</div></div>
      </div>`;
    if (streakGameOver) {
      return scores + `
        <div class="streak-gameover">
          <div class="streak-gameover-title">המרתון נגמר</div>
          <div class="puzzle-correct-answer">התשובה הנכונה: ${escapeHtml(streakLastAnswer)}<button class="flow-speak-btn" id="streak-answer-play" onclick="speak('${escapeJs(streakLastAnswer)}', 'streak-answer-play')" aria-label="השמע בגרמנית">🔊</button></div>
          <div class="check-actions" style="margin-top:12px;"><button class="nav-btn" onclick="restartStreak()">התחל מרתון חדש</button></div>
        </div>`;
    }
    return scores + `
      <div class="check-card">
        <div class="check-he">${escapeHtml(streakTarget.he)}</div>
        <input type="text" class="check-input" id="streakInput" placeholder="כתוב את התרגום בגרמנית..." dir="ltr" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <div class="check-actions"><button class="nav-btn" onclick="submitStreak()">בדוק</button></div>
      </div>`;
  }

  function submitStreak() {
    const input = document.getElementById('streakInput');
    if (!input || !streakTarget) return;
    const isCorrect = normalizeDe(input.value) === normalizeDe(streakTarget.de);
    recordAttempt(streakTarget.de, isCorrect);
    renderProgress();
    if (isCorrect) {
      streakCurrent++;
      if (streakCurrent > streakBest) {
        streakBest = streakCurrent;
        safeSet('delearn_best_streak', String(streakBest));
      }
      streakTarget = pickWeightedSentence(streakTarget);
      renderGames();
    } else {
      streakLastAnswer = streakTarget.de;
      streakGameOver = true;
      renderGames();
    }
  }

  function restartStreak() {
    streakCurrent = 0;
    streakGameOver = false;
    streakTarget = pickWeightedSentence(streakTarget);
    renderGames();
  }

  function bindStreakEnter() {
    const input = document.getElementById('streakInput');
    if (input) {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submitStreak();
      });
    }
  }

  let crosswordData = null;

  let crosswordDir = 'across';

  let crosswordLastCellKey = null;

  let crosswordZoom = parseInt(safeGet('delearn_cw_zoom', '38'), 10);

  let crosswordLevel = parseInt(safeGet('delearn_cw_level', '1'), 10);

  let crosswordLevelDone = false;

  function zoomCrossword(delta) {
    crosswordZoom = Math.max(26, Math.min(60, crosswordZoom + delta));
    safeSet('delearn_cw_zoom', String(crosswordZoom));
    const gridEl = document.getElementById('cwGrid');
    if (!gridEl) return;
    gridEl.style.setProperty('--cw-size', crosswordZoom + 'px');
    gridEl.style.setProperty('--cw-font', Math.round(crosswordZoom * 0.42) + 'px');
    gridEl.style.setProperty('--cw-clue-font', Math.max(6, Math.round(crosswordZoom * 0.2)) + 'px');
  }

  function cleanClueText(he) {
    return he.replace(/\s*\([^)]*\)/g, '').trim();
  }

  function crosswordTargetCount(level) {
    return Math.min(5 + (level - 1) * 2, 16);
  }

  function crosswordDifficultyMix(level) {
    if (level <= 2) return { mastered: 0.5, fresh: 0.4, progressing: 0.1, weak: 0 };
    if (level <= 4) return { mastered: 0.25, fresh: 0.35, progressing: 0.3, weak: 0.1 };
    if (level <= 6) return { mastered: 0.1, fresh: 0.25, progressing: 0.35, weak: 0.3 };
    return { mastered: 0.05, fresh: 0.15, progressing: 0.3, weak: 0.5 };
  }

  function getCrosswordUsedWords() {
    try { return new Set(JSON.parse(safeGet('delearn_cw_used', '[]'))); } catch (e) { return new Set(); }
  }

  function markCrosswordWordsUsed(words) {
    const used = getCrosswordUsedWords();
    words.forEach(w => used.add(w.toLowerCase()));
    const arr = [...used];
    const capped = arr.length > 400 ? arr.slice(arr.length - 400) : arr; // cap growth; oldest fall off first
    safeSet('delearn_cw_used', JSON.stringify(capped));
  }

  function pickCrosswordCandidates() {
    const basePool = VOCAB.filter(v => {
      if (/\s/.test(v.de)) return false; // single words only, no phrases
      const letters = v.de.replace(/[^A-Za-zÀ-ÖØ-öø-ÿß]/g, '');
      return letters.length >= 3 && letters.length <= 9 && letters === v.de;
    });
    const target = crosswordTargetCount(crosswordLevel);
    const mix = crosswordDifficultyMix(crosswordLevel);
    const usedWords = getCrosswordUsedWords();
    const withStats = basePool.map(item => ({ item, ratio: masteryRatio(getStat(item.de)), used: usedWords.has(item.de.toLowerCase()) }));
    // within each mastery tier, unused words come first — so a fresh level means fresh words, not just fresh difficulty
    const tier = (pred) => {
      const matches = withStats.filter(pred);
      const unused = shuffleArray(matches.filter(x => !x.used));
      const used = shuffleArray(matches.filter(x => x.used));
      return unused.concat(used);
    };
    const buckets = {
      weak: tier(x => x.ratio !== null && x.ratio < 0.4),
      progressing: tier(x => x.ratio !== null && x.ratio >= 0.4 && x.ratio < 0.8),
      mastered: tier(x => x.ratio !== null && x.ratio >= 0.8),
      fresh: tier(x => x.ratio === null),
    };
    const picked = [];
    const pickedDe = new Set();
    Object.keys(mix).forEach(key => {
      const n = Math.round(mix[key] * target);
      for (let i = 0; i < n && buckets[key].length; i++) {
        const x = buckets[key].shift();
        if (!pickedDe.has(x.item.de)) { picked.push(x.item); pickedDe.add(x.item.de); }
      }
    });
    // placement isn't guaranteed to succeed for every word — oversample a bit so there's slack
    const wantExtra = target + 6;
    if (picked.length < wantExtra) {
      const rest = shuffleArray(Object.values(buckets).flat().filter(x => !pickedDe.has(x.item.de)));
      for (const x of rest) {
        if (picked.length >= wantExtra) break;
        picked.push(x.item); pickedDe.add(x.item.de);
      }
    }
    return shuffleArray(picked).slice(0, wantExtra);
  }

  function tryBuildCrossword(candidates) {
    const letterMap = new Map(); // 'r,c' -> letter
    const clueMap = new Map();   // 'r,c' -> true (reserved for a clue label, never a letter)
    const placed = [];

    function clueCellFor(row, col, dir) {
      return dir === 'across' ? [row, col - 1] : [row - 1, col];
    }

    function canPlace(word, row, col, dir) {
      const len = word.length;
      const [cr, cc] = clueCellFor(row, col, dir);
      const clueKey = cr + ',' + cc;
      if (letterMap.has(clueKey) || clueMap.has(clueKey)) return false;
      for (let i = 0; i < len; i++) {
        const r = dir === 'across' ? row : row + i;
        const c = dir === 'across' ? col + i : col;
        const key = r + ',' + c;
        if (clueMap.has(key)) return false;
        const existing = letterMap.get(key);
        if (existing && existing !== word[i]) return false;
        if (!existing) {
          if (dir === 'across') {
            if (letterMap.has((r - 1) + ',' + c) || letterMap.has((r + 1) + ',' + c)) return false;
            if (clueMap.has((r - 1) + ',' + c) || clueMap.has((r + 1) + ',' + c)) return false;
          } else {
            if (letterMap.has(r + ',' + (c - 1)) || letterMap.has(r + ',' + (c + 1))) return false;
            if (clueMap.has(r + ',' + (c - 1)) || clueMap.has(r + ',' + (c + 1))) return false;
          }
        }
      }
      const afterR = dir === 'across' ? row : row + len;
      const afterC = dir === 'across' ? col + len : col;
      if (letterMap.has(afterR + ',' + afterC) || clueMap.has(afterR + ',' + afterC)) return false;
      return true;
    }

    function placeWord(wordObj, row, col, dir) {
      const word = wordObj.de.toUpperCase();
      for (let i = 0; i < word.length; i++) {
        const r = dir === 'across' ? row : row + i;
        const c = dir === 'across' ? col + i : col;
        letterMap.set(r + ',' + c, word[i]);
      }
      const [cr, cc] = clueCellFor(row, col, dir);
      clueMap.set(cr + ',' + cc, true);
      placed.push({ answer: word, clue: cleanClueText(wordObj.he), row, col, dir, len: word.length, clueRow: cr, clueCol: cc });
    }

    if (!candidates.length) return { placed, letterMap, clueMap };
    placeWord(candidates[0], 1, 1, 'across');

    for (let idx = 1; idx < candidates.length; idx++) {
      const wordObj = candidates[idx];
      const word = wordObj.de.toUpperCase();
      let bestPlacement = null;
      outer:
      for (let wi = 0; wi < word.length; wi++) {
        const letter = word[wi];
        for (const [key, existingLetter] of letterMap.entries()) {
          if (existingLetter !== letter) continue;
          const parts = key.split(',');
          const er = parseInt(parts[0], 10), ec = parseInt(parts[1], 10);
          for (const dir of ['across', 'down']) {
            const row = dir === 'across' ? er : er - wi;
            const col = dir === 'across' ? ec - wi : ec;
            if (canPlace(word, row, col, dir)) {
              bestPlacement = { row, col, dir };
              break outer;
            }
          }
        }
      }
      if (bestPlacement) placeWord(wordObj, bestPlacement.row, bestPlacement.col, bestPlacement.dir);
    }
    return { placed, letterMap, clueMap };
  }

  function finalizeCrossword(placed, letterMap, clueMap) {
    if (!placed.length) { crosswordData = null; return; }
    let minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
    for (const key of [...letterMap.keys(), ...clueMap.keys()]) {
      const parts = key.split(',');
      const r = parseInt(parts[0], 10), c = parseInt(parts[1], 10);
      minR = Math.min(minR, r); maxR = Math.max(maxR, r);
      minC = Math.min(minC, c); maxC = Math.max(maxC, c);
    }
    const rows = maxR - minR + 1, cols = maxC - minC + 1;
    const grid = Array.from({ length: rows }, () => Array(cols).fill(null));
    for (const [key, letter] of letterMap.entries()) {
      const parts = key.split(',');
      const r = parseInt(parts[0], 10) - minR, c = parseInt(parts[1], 10) - minC;
      grid[r][c] = { type: 'letter', letter };
    }
    placed.forEach(w => {
      w.row -= minR; w.col -= minC;
      w.clueRow -= minR; w.clueCol -= minC;
      grid[w.clueRow][w.clueCol] = { type: 'clue', clue: w.clue, dir: w.dir, len: w.len, answer: w.answer };
    });
    crosswordData = { grid, rows, cols, words: placed };
  }

  function buildCrossword() {
    let best = null;
    const target = crosswordTargetCount(crosswordLevel);
    for (let attempt = 0; attempt < 8; attempt++) {
      const candidates = pickCrosswordCandidates();
      if (candidates.length < 5) continue;
      const result = tryBuildCrossword(candidates);
      if (!best || result.placed.length > best.placed.length) best = result;
      if (result.placed.length >= target) break;
    }
    crosswordDir = 'across';
    crosswordLastCellKey = null;
    crosswordLevelDone = false;
    if (best && best.placed.length) {
      finalizeCrossword(best.placed, best.letterMap, best.clueMap);
      markCrosswordWordsUsed(crosswordData.words.map(w => w.answer));
    } else {
      crosswordData = null;
    }
  }

  function advanceCrosswordLevel() {
    crosswordLevel++;
    safeSet('delearn_cw_level', String(crosswordLevel));
    buildCrossword();
    renderGames();
  }

  function renderCrosswordGameHtml() {
    if (!crosswordData) buildCrossword();
    if (!crosswordData) {
      return `<div class="vocab-missed-empty">אין כרגע מספיק מילים קצרות ליצירת תשחץ.</div>`;
    }
    const { grid, rows, cols } = crosswordData;
    let cellsHtml = '';
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = grid[r][c];
        if (!cell) { cellsHtml += `<div class="cw-cell cw-cell-blank"></div>`; continue; }
        if (cell.type === 'clue') {
          const arrow = cell.dir === 'across' ? '→' : '↓';
          const speakId = `cw-speak-${r}-${c}`;
          cellsHtml += `
            <div class="cw-cell cw-cell-clue">
              <div class="cw-clue-top">
                <span class="cw-clue-arrow">${arrow}</span>
                <button class="cw-clue-speak" id="${speakId}" onclick="event.stopPropagation(); speak('${escapeJs(cell.answer)}', '${speakId}')" aria-label="השמע בגרמנית">🔊</button>
              </div>
              <span class="cw-clue-text">${escapeHtml(cell.clue)}</span>
            </div>`;
        } else {
          const id = `cw-${r}-${c}`;
          const wordsHere = crosswordWordsAt(r, c);
          const isLocked = wordsHere.some(w => w.recorded);
          cellsHtml += `
            <div class="cw-cell cw-cell-active${isLocked ? ' cw-correct' : ''}">
              <input class="cw-input${isLocked ? ' cw-locked' : ''}" id="${id}" maxlength="1" data-row="${r}" data-col="${c}" value="${isLocked ? cell.letter : ''}" ${isLocked ? 'readonly' : ''} oninput="onCrosswordInput(this)" onclick="onCrosswordCellClick(this)" onkeydown="onCrosswordKeydown(event, this)" />
            </div>`;
        }
      }
    }
    const z = crosswordZoom;
    const fontSize = Math.round(z * 0.42);
    const clueFontSize = Math.max(6, Math.round(z * 0.2));
    const gridStyle = `grid-template-columns: repeat(${cols}, var(--cw-size)); grid-template-rows: repeat(${rows}, var(--cw-size)); --cw-size: ${z}px; --cw-font: ${fontSize}px; --cw-clue-font: ${clueFontSize}px;`;
    const gridHtml = `<div class="cw-grid-scroll"><div class="cw-grid" id="cwGrid" style="${gridStyle}">${cellsHtml}</div></div>`;

    const umlautRow = `
      <div class="cw-umlaut-row">
        ${['Ä', 'Ö', 'Ü', 'ß'].map(ch => `<button class="cw-umlaut-btn" onclick="insertCrosswordChar('${ch}')">${ch}</button>`).join('')}
      </div>`;

    const zoomRow = `
      <div class="cw-zoom-row">
        <button class="cw-zoom-btn" onclick="zoomCrossword(-4)">➖</button>
        <span class="cw-zoom-label">הגדלה</span>
        <button class="cw-zoom-btn" onclick="zoomCrossword(4)">➕</button>
      </div>`;

    const doneCount = crosswordData.words.filter(w => w.recorded).length;
    const levelRow = `
      <div class="cw-level-row">
        <span class="cw-level-badge">רמה ${crosswordLevel}</span>
        <span class="cw-level-progress">${doneCount} / ${crosswordData.words.length} מילים</span>
      </div>`;

    const completionBanner = crosswordLevelDone ? `
      <div class="cw-complete-banner">
        🎉 סיימת את רמה ${crosswordLevel}!
        <button class="cw-next-level-btn" onclick="advanceCrosswordLevel()">לרמה ${crosswordLevel + 1} ›</button>
      </div>` : '';

    return `
      <div class="cw-wrap">
        ${levelRow}
        ${completionBanner}
        <div class="cw-actions">
          <button class="nav-btn" onclick="buildCrossword(); renderGames();">🔀 פאזל חדש (אותה רמה)</button>
          <button class="nav-btn" onclick="checkCrossword()">✓ בדיקה</button>
          <button class="nav-btn" onclick="revealCrossword()">הראה פתרון</button>
        </div>
        ${zoomRow}
        ${gridHtml}
        ${umlautRow}
        <div class="cw-result" id="cwResult"></div>
      </div>`;
  }

  function crosswordCellDirections(r, c) {
    const { grid, rows, cols } = crosswordData;
    const isLetter = (rr, cc) => rr >= 0 && rr < rows && cc >= 0 && cc < cols && grid[rr][cc] && grid[rr][cc].type === 'letter';
    return { inAcross: isLetter(r, c - 1) || isLetter(r, c + 1), inDown: isLetter(r - 1, c) || isLetter(r + 1, c) };
  }

  function onCrosswordCellClick(input) {
    if (!crosswordData) return;
    const r = parseInt(input.dataset.row, 10), c = parseInt(input.dataset.col, 10);
    const key = r + ',' + c;
    const { inAcross, inDown } = crosswordCellDirections(r, c);
    if (inAcross && inDown) {
      if (crosswordLastCellKey === key) {
        crosswordDir = crosswordDir === 'across' ? 'down' : 'across';
      } else if (!((crosswordDir === 'across' && inAcross) || (crosswordDir === 'down' && inDown))) {
        crosswordDir = 'across';
      }
    } else if (inAcross) {
      crosswordDir = 'across';
    } else if (inDown) {
      crosswordDir = 'down';
    }
    crosswordLastCellKey = key;
  }

  function onCrosswordKeydown(e, input) {
    if (e.key === 'Backspace' && !input.value) {
      const row = parseInt(input.dataset.row, 10), col = parseInt(input.dataset.col, 10);
      const prevR = crosswordDir === 'across' ? row : row - 1;
      const prevC = crosswordDir === 'across' ? col - 1 : col;
      const prevEl = document.getElementById(`cw-${prevR}-${prevC}`);
      if (prevEl) { prevEl.focus(); crosswordLastCellKey = prevR + ',' + prevC; }
    }
  }

  function crosswordWordsAt(r, c) {
    return crosswordData.words.filter(w => {
      if (w.dir === 'across') return w.row === r && c >= w.col && c < w.col + w.len;
      return w.col === c && r >= w.row && r < w.row + w.len;
    });
  }

  function isCrosswordFullyComplete() {
    if (!crosswordData) return false;
    return crosswordData.words.every(w => w.recorded);
  }

  function lockCompletedWords(row, col) {
    const words = crosswordWordsAt(row, col);
    words.forEach(w => {
      if (w.recorded) return;
      let complete = true;
      for (let i = 0; i < w.len; i++) {
        const r = w.dir === 'across' ? w.row : w.row + i;
        const c = w.dir === 'across' ? w.col + i : w.col;
        const inp = document.getElementById(`cw-${r}-${c}`);
        if (!inp || (inp.value || '').toUpperCase() !== w.answer[i]) { complete = false; break; }
      }
      if (complete) {
        for (let i = 0; i < w.len; i++) {
          const r = w.dir === 'across' ? w.row : w.row + i;
          const c = w.dir === 'across' ? w.col + i : w.col;
          const inp = document.getElementById(`cw-${r}-${c}`);
          if (inp) {
            inp.readOnly = true;
            inp.classList.add('cw-locked');
            inp.parentElement.classList.add('cw-correct');
            inp.parentElement.classList.remove('cw-wrong');
          }
        }
        w.recorded = true;
        recordAttempt(w.answer, true);
      }
    });
    if (isCrosswordFullyComplete() && !crosswordLevelDone) {
      crosswordLevelDone = true;
      renderProgress();
      renderGames();
    } else {
      renderProgress();
    }
  }

  function onCrosswordInput(input) {
    const val = (input.value || '').toUpperCase().slice(-1);
    input.value = val;
    const row = parseInt(input.dataset.row, 10), col = parseInt(input.dataset.col, 10);
    const cell = crosswordData.grid[row][col];
    if (val) {
      if (val === cell.letter) {
        input.parentElement.classList.add('cw-correct');
        input.parentElement.classList.remove('cw-wrong');
      } else {
        input.parentElement.classList.add('cw-wrong');
        input.parentElement.classList.remove('cw-correct');
      }
      lockCompletedWords(row, col);
      let nextR = crosswordDir === 'across' ? row : row + 1;
      let nextC = crosswordDir === 'across' ? col + 1 : col;
      let nextEl = document.getElementById(`cw-${nextR}-${nextC}`);
      while (nextEl && nextEl.readOnly) {
        nextR = crosswordDir === 'across' ? nextR : nextR + 1;
        nextC = crosswordDir === 'across' ? nextC + 1 : nextC;
        nextEl = document.getElementById(`cw-${nextR}-${nextC}`);
      }
      if (nextEl) { nextEl.focus(); crosswordLastCellKey = nextR + ',' + nextC; }
    } else {
      input.parentElement.classList.remove('cw-correct', 'cw-wrong');
    }
  }

  function insertCrosswordChar(ch) {
    const active = document.activeElement;
    if (active && active.classList && active.classList.contains('cw-input')) {
      active.value = ch;
      onCrosswordInput(active);
    }
  }

  function checkCrossword() {
    if (!crosswordData) return;
    const { grid, rows, cols } = crosswordData;
    let allCorrect = true, anyFilled = false;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = grid[r][c];
        if (!cell || cell.type !== 'letter') continue;
        const input = document.getElementById(`cw-${r}-${c}`);
        if (!input) continue;
        const val = (input.value || '').toUpperCase();
        if (val) anyFilled = true;
        if (val && val === cell.letter) {
          input.readOnly = true;
          input.classList.add('cw-locked');
          input.parentElement.classList.add('cw-correct');
          input.parentElement.classList.remove('cw-wrong');
        } else {
          input.parentElement.classList.remove('cw-correct');
          if (val) input.parentElement.classList.add('cw-wrong');
          if (val !== cell.letter) allCorrect = false;
        }
      }
    }
    const resultEl = document.getElementById('cwResult');
    if (resultEl) {
      resultEl.textContent = allCorrect && anyFilled ? '🎉 פתרת את התשחץ!' : 'יש עוד תאים ריקים או שגויים';
      resultEl.className = 'cw-result' + (allCorrect && anyFilled ? ' cw-result-correct' : '');
    }
  }

  function revealCrossword() {
    if (!crosswordData) return;
    const { grid, rows, cols } = crosswordData;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = grid[r][c];
        if (!cell || cell.type !== 'letter') continue;
        const input = document.getElementById(`cw-${r}-${c}`);
        if (input) {
          input.value = cell.letter;
          input.readOnly = true;
          input.classList.add('cw-locked');
          input.parentElement.classList.add('cw-correct');
          input.parentElement.classList.remove('cw-wrong');
        }
      }
    }
    crosswordData.words.forEach(w => {
      if (!w.recorded) { w.recorded = true; recordAttempt(w.answer, false); }
    });
    crosswordLevelDone = true;

  function spCleanHe(s) { return String(s || '').replace(/\s*\([^)]*[A-Za-z][^)]*\)/g, '').replace(/\s+/g, ' ').trim(); }
  window.SPEAK_NOTES = { get: c => { try { return getVocabNotes()[c.answer] || ''; } catch (e) { return ''; } }, set: (c, t) => { try { setVocabNote(c.answer, t); } catch (e) {} } };
  function spGermanGroups() {
    const cnt = f => VOCAB.filter(f).length;
    const g = [{ id: 'all', label: 'כל אוצר המילים', count: VOCAB.length, section: '' }];
    let missed = []; try { missed = getMissedList(); } catch (e) {}
    const m = cnt(v => missed.includes(v.de));
    if (m) g.push({ id: 'missed', label: 'מילים שטעיתי בהן', count: m, section: '' });
    vocabCategoryList().forEach(c => g.push({ id: 'c:' + c, label: c, count: cnt(v => (v.category || 'כללי') === c), section: 'לפי קטגוריה' }));
    return g;
  }
  function openGermanSpeak() {
    if (!window.SpeakPractice) return;
    SpeakPractice.open({
      title: 'אמרו את המילה בגרמנית',
      setupTitle: 'תרגול אוצר מילים בדיבור',
      storeKey: 'delearn_sp_cfg',
      getGroups: spGermanGroups,
      getItems: ({ group, count, preferNew }) => {
        let pool = VOCAB;
        if (group === 'missed') { const missed = getMissedList(); pool = pool.filter(v => missed.includes(v.de)); }
        else if (group.indexOf('c:') === 0) { const c = group.slice(2); pool = pool.filter(v => (v.category || 'כללי') === c); }
        const pri = v => { const r = masteryRatio(getStat(v.de)); return r === null ? 1 : r < 0.4 ? 0 : r < 0.8 ? 2 : 3; };
        let pick = shuffleArray(pool.slice());
        if (preferNew) pick = pick.map(v => [pri(v), v]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
        pick = pick.slice(0, count);
        return shuffleArray(pick).map(v => ({ ref: v, prompt: spCleanHe(v.he), answer: v.de, display: (v.gender ? v.gender + ' ' : '') + v.de, hint: v.pos }));
      },
      onResult: (v, ok) => { recordAttempt(v.de, ok); try { renderProgress(); } catch (e) {} },
      onClose: () => { try { renderVocab(); } catch (e) {} }
    });
  }

    Bowls.open({
      title: 'קערות מילים', items: items, allLabel: 'כל אוצר המילים',
      categories: vocabCategoryList().map(c => ({ id: c, label: c })),
      getKnown: get,

      onAttempt: (it, ok) => { recordAttempt(it.de, ok); },

    });
