<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לומדים גרמנית</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&family=Source+Serif+4:ital,wght@0,500;0,600;1,500&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF7F2;
    --surface: #FFFFFF;
    --ink: #2B2A28;
    --ink-soft: #6B6560;
    --accent: #3D5A73;
    --accent-soft: #E7EEF2;
    --line: #E4DDD1;
    --tag-1: #8B7355;
    --tag-2: #6E7F63;
    --tag-3: #A15C4D;
    --tag-4: #55738A;
    --tag-5: #7A6A8A;
    --tag-1-bg: #F3EDE3;
    --tag-2-bg: #EAEEE6;
    --tag-3-bg: #F5E8E3;
    --tag-4-bg: #E6EDF1;
    --tag-5-bg: #EEE8F1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C1B19;
      --surface: #262421;
      --ink: #EDE8E0;
      --ink-soft: #A39C90;
      --accent: #8FB4CE;
      --accent-soft: #2A3944;
      --line: #3A362F;
      --tag-1-bg: #362F24; --tag-2-bg: #2A3128; --tag-3-bg: #362823; --tag-4-bg: #223038; --tag-5-bg: #2E2836;
      --tag-1: #D2B98C; --tag-2: #A9BFA0; --tag-3: #D79488; --tag-4: #8FB4CE; --tag-5: #B6A0C7;
    }}
  :root[data-theme="dark"] {
    --bg: #1C1B19;
    --surface: #262421;
    --ink: #EDE8E0;
    --ink-soft: #A39C90;
    --accent: #8FB4CE;
    --accent-soft: #2A3944;
    --line: #3A362F;
    --tag-1-bg: #362F24; --tag-2-bg: #2A3128; --tag-3-bg: #362823; --tag-4-bg: #223038; --tag-5-bg: #2E2836;
    --tag-1: #D2B98C; --tag-2: #A9BFA0; --tag-3: #D79488; --tag-4: #8FB4CE; --tag-5: #B6A0C7;
  }

  * { box-sizing: border-box; }
  html { overflow-x: hidden; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Heebo', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }
  header { margin-bottom: 22px; }
  h1 {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 700;
    font-size: 30px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0;
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin: 22px 0 20px;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    white-space: nowrap;
    background: none;
    border: none;
    font-family: 'Heebo', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-soft);
    padding: 10px 4px 12px;
    cursor: pointer;
    position: relative;
    -webkit-appearance: none;
  }
  .tab.active { color: var(--ink); }
  .tab.active::after {
    content: "";
    position: absolute;
    right: 0; left: 0; bottom: -1px;
    height: 2px;
    background: var(--accent);
    border-radius: 2px;
  }

  .view { display: none; }
  .view.active { display: block; }

  .category {
    margin-bottom: 26px;
  }
  .category-title {
    display: inline-block;
    font-size: 12.5px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
  }

  .sentence-row {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .sentence-text { flex: 1; min-width: 0; }
  .sentence-he {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 3px;
  }
  .sentence-de {
    font-family: 'Source Serif 4', serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    direction: ltr;
    text-align: right;
    margin: 0;
    unicode-bidi: isolate;
  }

  .play-btn {
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.12s ease;
  }
  .play-btn:active { transform: scale(0.92); }
  .play-btn.speaking { background: var(--accent); color: var(--surface); }
  .play-btn-sm { width: 24px; height: 24px; font-size: 11px; }
  .gender-card .play-btn-sm { margin-top: 4px; }

  .ext-links { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
  .ext-link {
    font-size: 11.5px;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 9px;
    white-space: nowrap;
    font-family: 'Heebo', sans-serif;
  }
  .ext-link:active { opacity: 0.7; }

  .letter-group { margin-bottom: 18px; }
  .letter-heading {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding-bottom: 6px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--line);
    direction: ltr;
    text-align: right;
  }

  .vocab-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 2px;
    border-bottom: 1px solid var(--line);
  }
  .vocab-row:last-child { border-bottom: none; }
  .vocab-main { flex: 1; min-width: 0; }
  .vocab-de {
    font-family: 'Source Serif 4', serif;
    font-size: 16.5px;
    font-weight: 600;
    direction: ltr;
    text-align: right;
    unicode-bidi: isolate;
    cursor: pointer;
  }
  .vocab-de:active { opacity: 0.7; }
  .assoc-star {
    color: #4C8B5A;
    font-size: 13px;
    margin-inline-start: 4px;
  }
  .vocab-pos {
    font-size: 11.5px;
    color: var(--ink-soft);
    font-weight: 400;
    margin-inline-start: 6px;
  }
  .vx { margin-top: 10px; padding: 8px 12px; background: var(--accent-soft, #ddf4ff); border: 2px solid var(--fun-blue, #1cb0f6); border-radius: 14px; text-align: right; line-height: 1.45; }
  .vx .vx-de { direction: ltr; text-align: left; font-weight: 800; font-size: 15px; }
  .vx .vx-he { font-size: 13px; color: var(--ink-soft, #777); }
  .vx .vx-say { border: 0; background: transparent; font-size: 15px; cursor: pointer; padding: 0 6px; }
  .vx.vx-sm { margin-top: 4px; padding: 4px 9px; border-width: 1px; background: transparent; border-color: var(--line, #e5e5e5); }
  .vx.vx-sm .vx-de { font-size: 13px; font-weight: 700; }
  .grid-card-ex { font-size: 10.5px; line-height: 1.3; color: var(--ink-soft, #777); padding: 3px 4px 0; border-top: 1px dashed var(--line, #ddd); width: 100%; font-style: italic; }
  .vocab-hint { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; direction: rtl; unicode-bidi: plaintext; }
  .vocab-he {
    font-size: 13.5px;
    color: var(--ink-soft);
    margin-top: 1px;
  }
  .note-panel {
    margin-top: 8px;
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 10px;
  }
  .note-text {
    font-size: 13.5px;
    color: var(--ink);
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .note-edit-btn, .note-save-btn {
    margin-top: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--accent);
    border-radius: 7px;
    padding: 5px 10px;
    font-size: 12.5px;
    font-family: 'Heebo', sans-serif;
    cursor: pointer;
  }
  .note-input {
    width: 100%;
    min-height: 54px;
    resize: vertical;
    font-family: 'Heebo', sans-serif;
    font-size: 13.5px;
    padding: 8px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
  }

  .empty {
    text-align: center;
    padding: 50px 20px;
    color: var(--ink-soft);
    font-size: 14.5px;
    line-height: 1.7;
  }
  .empty-emoji { font-size: 28px; display: block; margin-bottom: 10px; }

  .settings-toggle {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    border-radius: 8px;
    font-size: 13px;
    padding: 6px 10px;
    cursor: pointer;
    font-family: 'Heebo', sans-serif;
    flex-shrink: 0;
  }
  .head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .head-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .home-wrap { padding: 8px 0 28px; }
  .home-hello { font-family: 'Frank Ruhl Libre', serif; font-size: 22px; font-weight: 500; margin: 6px 2px 18px; color: var(--ink); }
  .home-group + .home-group { margin-top: 22px; }
  .home-group-title { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-soft); margin: 0 4px 8px; }
  .home-list {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
  }
  .home-row {
    display: flex; align-items: center; gap: 14px; width: 100%;
    padding: 14px 16px; background: transparent; border: 0; border-bottom: 1px solid var(--line);
    font-family: 'Heebo', sans-serif; color: var(--ink); text-align: start; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .home-row:last-child { border-bottom: 0; }
  .home-row:active { background: var(--accent-soft); }
  .home-row-icon {
    flex: 0 0 38px; height: 38px; border-radius: 50%; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center; font-size: 19px;
  }
  .home-row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .home-row-label { font-size: 15.5px; font-weight: 600; }
  .home-row-sub { font-size: 12px; color: var(--ink-soft); }
  .home-row-chev { color: var(--ink-soft); font-size: 18px; opacity: 0.6; }
  .settings-panel {
    display: none;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    margin-top: 14px;
  }
  .settings-panel.open { display: block; }
  .settings-row { margin-bottom: 12px; }
  .settings-row:last-child { margin-bottom: 0; }
  .settings-row label {
    display: block;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .settings-row select, .settings-row input[type=range] { width: 100%; }
  select#voiceSelect {
    font-family: 'Heebo', sans-serif;
    font-size: 14px;
    padding: 7px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    width: 100%;
  }
  .global-search-wrap { padding: 0 16px 10px; }
  .global-search-row { position: relative; }
  .global-search-input {
    width: 100%;
    font-family: 'Heebo', sans-serif;
    font-size: 14px;
    padding: 11px 36px 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    box-sizing: border-box;
  }
  .global-search-clear {
    position: absolute;
    top: 50%;
    left: 8px;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 15px;
    cursor: pointer;
    padding: 4px;
  }
  .global-search-results {
    margin-top: 8px;
    max-height: 60vh;
    overflow-y: auto;
  }
  .search-section-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    margin: 10px 2px 6px;
  }
  .search-empty {
    text-align: center;
    font-size: 13.5px;
    color: var(--ink-soft);
    padding: 14px 10px;
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: 10px;
  }
  .vocab-grid-hint { text-align: center; font-size: 11.5px; color: var(--ink-soft); margin-bottom: 12px; line-height: 1.5; }
  .vocab-grid-wrap {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .grid-card-wrap { perspective: 900px; }
  .grid-card {
    position: relative;
    min-height: 96px;
    transform-style: preserve-3d;
    transition: transform 0.35s cubic-bezier(0.4, 0.2, 0.2, 1), box-shadow 0.2s ease, opacity 0.2s ease;
    cursor: pointer;
    touch-action: none;
  }
  .grid-card.flipped { transform: rotateY(180deg); }
  .grid-card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 5px;
    text-align: center;
    overflow: hidden;
  }
  .grid-card-back { transform: rotateY(180deg); background: var(--accent-soft); }
  .grid-card-back { flex-direction: column; gap: 4px; }
  .vocab-grid-wrap .grid-card { min-height: 120px; }
  .grid-card-text { font-size: 12.5px; font-weight: 600; line-height: 1.3; word-break: break-word; }
  .grid-card-text.is-de { font-family: 'Source Serif 4', serif; direction: ltr; unicode-bidi: isolate; }
  .grid-card-speak {
    position: absolute;
    top: 2px;
    left: 2px;
    background: none;
    border: none;
    font-size: 12px;
    padding: 3px;
    line-height: 1;
    cursor: pointer;
    color: var(--ink-soft);
    z-index: 1;
  }
  .grid-card-speak.speaking { color: var(--accent); }
  .grid-card-wrap.is-sentence .grid-card { min-height: 122px; }
  .grid-card-wrap.is-sentence .grid-card-text { font-size: 11px; line-height: 1.3; }
  .flash-grid-mode-row { margin-bottom: 10px; }
  .kater-progress-line { text-align: center; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 14px; }
  .cw-wrap { }
  .cw-level-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
  .cw-level-badge {
    background: var(--accent); color: var(--surface);
    border-radius: 20px; padding: 4px 14px;
    font-size: 13px; font-weight: 700;
  }
  .cw-level-progress { font-size: 12.5px; color: var(--ink-soft); }
  .cw-complete-banner {
    background: #E3F0E6; color: #4C8B5A;
    border-radius: 12px; padding: 14px; margin-bottom: 14px;
    text-align: center; font-size: 15px; font-weight: 700;
  }
  .cw-next-level-btn {
    display: block; margin: 10px auto 0;
    background: #4C8B5A; color: var(--surface);
    border: none; border-radius: 10px; padding: 11px 20px;
    font-size: 14px; font-family: 'Heebo', sans-serif; cursor: pointer;
  }
  .cw-actions { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .cw-actions .nav-btn { flex: 1 1 28%; }
  .cw-grid-scroll { overflow-x: auto; margin-bottom: 14px; padding-bottom: 4px; }
  .cw-grid {
    --cw-size: 38px;
    --cw-font: 16px;
    --cw-clue-font: 7.5px;
    display: inline-grid;
    gap: 2px;
    direction: ltr;
    background: var(--line);
    padding: 2px;
    border-radius: 6px;
  }
  .cw-cell { width: var(--cw-size); height: var(--cw-size); position: relative; }
  .cw-cell-blank { background: transparent; }
  .cw-cell-active { background: var(--surface); border-radius: 2px; }
  .cw-cell-active.cw-correct { background: #E3F0E6; }
  .cw-cell-active.cw-wrong { background: var(--tag-3-bg); }
  .cw-cell-clue {
    background: var(--ink);
    border-radius: 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1px;
    overflow: hidden;
  }
  .cw-clue-top { display: flex; align-items: center; justify-content: center; gap: 3px; }
  .cw-clue-arrow { color: var(--surface); font-size: var(--cw-clue-font); line-height: 1; }
  .cw-clue-speak {
    background: none; border: none; padding: 0;
    font-size: var(--cw-clue-font); line-height: 1; cursor: pointer;
    filter: brightness(1.4);
  }
  .cw-clue-text {
    color: var(--surface);
    font-size: var(--cw-clue-font);
    font-weight: 600;
    line-height: 1.1;
    text-align: center;
    word-break: break-word;
  }
  .cw-input {
    width: 100%; height: 100%;
    border: none; background: transparent;
    text-align: center; font-size: var(--cw-font); font-weight: 700;
    font-family: 'Heebo', sans-serif;
    color: var(--ink);
    text-transform: uppercase;
    direction: ltr;
    padding: 0;
    box-sizing: border-box;
  }
  .cw-input:focus { outline: 2px solid var(--accent); background: var(--accent-soft); }
  .cw-input.cw-locked { color: #4C8B5A; }
  .cw-zoom-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
  .cw-zoom-btn {
    background: var(--accent-soft); color: var(--accent);
    border: none; border-radius: 8px; width: 36px; height: 36px;
    font-size: 15px; cursor: pointer;
  }
  .cw-zoom-label { font-size: 12.5px; color: var(--ink-soft); }
  .cw-umlaut-row { display: flex; gap: 6px; margin-bottom: 14px; justify-content: center; }
  .cw-umlaut-btn {
    background: var(--accent-soft); color: var(--accent);
    border: none; border-radius: 8px; padding: 8px 14px;
    font-size: 14px; font-family: 'Heebo', sans-serif; cursor: pointer;
  }
  .cw-result { text-align: center; font-size: 14px; font-weight: 600; padding: 10px; }
  .cw-result-correct { color: #4C8B5A; }
  #vocabModeRow { flex-wrap: wrap; row-gap: 8px; }
  #vocabModeRow .nav-btn { flex: 1 1 30%; }
  .mnem-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .mnem-top-row { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .mnem-de { font-family: 'Source Serif 4', serif; direction: ltr; unicode-bidi: isolate; font-weight: 700; font-size: 16px; flex: 1; }
  .mnem-he { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 10px; }
  .mnem-note-input {
    width: 100%;
    box-sizing: border-box;
    font-family: 'Heebo', sans-serif;
    font-size: 13.5px;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    resize: vertical;
    min-height: 44px;
    margin-bottom: 8px;
  }
  .mnem-clear-btn {
    background: var(--accent-soft);
    color: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 9px;
    font-size: 12.5px;
    font-family: 'Heebo', sans-serif;
    cursor: pointer;
    width: 100%;
  }
  .vocab-category-select {
    font-family: 'Heebo', sans-serif;
    font-size: 13.5px;
    padding: 9px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    width: 100%;
    margin-bottom: 12px;
  }
  .test-btn {
    margin-top: 8px;
    background: var(--accent-soft);
    color: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13.5px;
    font-family: 'Heebo', sans-serif;
    cursor: pointer;
  }
  .voice-note { font-size: 12px; color: var(--ink-soft); margin-top: 8px; line-height: 1.6; }

  .speed-group { display: flex; gap: 6px; }
  .speed-btn {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    border-radius: 8px;
    padding: 8px 4px;
    font-size: 13.5px;
    font-family: 'Heebo', sans-serif;
    cursor: pointer;
  }

      note = 'סיימנו את הבדיקה: ' + strong + ' נושאים כבר די מוכנים. את השאר נבנה שלב אחר שלב, ואת המוכנות נחזק בחזרות קצרות.';
      d.done[step.id] = Date.now(); d.plan = d.plan.filter(x => d.done[x.id]).concat(generate(Math.max(20, ST.budget - d.min)));
      cur = null; save(ST); return home(note);
    }
    if (step.type === 'apply') {
      ok = info.ratio >= 0.6 || (s.tries || 0) >= 1;
      if (!ok) { s.tries = (s.tries || 0) + 1; note = 'ידעת ' + Math.round(info.ratio * 100) + '%. נעשה עוד סיבוב קצר על מה שלא נכנס, זה לגמרי טבעי.'; }
      else { s.done[3] = Date.now(); s.tries = 0; note = 'יפה! ' + Math.round(info.ratio * 100) + '% ידעת. עכשיו המשפטים כבר זזים לפה.'; }
    } else if (step.type === 'evaluate') {
      if (info.ratio >= 0.7) { s.done[5] = Date.now(); scheduleReview(u, false); s.rv.due = dnum(today()) + 1; note = 'מצוין: ' + Math.round(info.ratio * 100) + '% בלי רמזים. הנושא "' + u.name + '" כבר אצלך. אחזור אליו מחר לחזרה קצרה.'; }
      else { delete s.done[3]; ok = false; note = 'בלי רמזים ידעת ' + Math.round(info.ratio * 100) + '%. אין בעיה: חוזרים לשלב היישום ואז נבחן שוב. ככה זה נשאר בראש.'; }
    } else if (step.type === 'review') {
      const k = scheduleReview(u, info.ratio >= 0.8);
      note = info.ratio >= 0.8 ? 'חזרה טובה: ' + Math.round(info.ratio * 100) + '%. אחזור לנושא הזה בעוד ' + k + ' ימים.' : 'ידעת ' + Math.round(info.ratio * 100) + '%. מחר נחזור לנושא הזה שוב.';
    } else if (step.type === 'vocab') { s.done[1] = Date.now(); if (u.kind === 'w') { s.rv.due = dnum(today()) + 2; note = 'מצוין. המילים האלה נכנסות כשחוזרים אליהן, אז אחזור אליהן בעוד יומיים.'; } else note = 'המילים של הנושא עברו. עכשיו נבין את המשפטים.'; }
    else if (step.type === 'analyze') { s.done[4] = Date.now(); note = 'יופי. עכשיו המשפטים כבר לא רק צלילים.'; }
    else if (step.type === 'read') { s.done[2] = Date.now(); note = 'הבנת את המשפטים. השלב הבא: להגיד אותם בקול.'; }
    else if (step.type === 'chain') { s.done[6] = Date.now(); if (!s.rv.due) s.rv.due = dnum(today()) + 1; note = 'שרשרת ראשונה נעשתה. זו כבר שיחה.'; }
    if (ok) d.done[step.id] = Date.now();
    else {
      const back = step.type === 'evaluate' && u ? stepFor(u, 3) : null;
      if (back) { d.plan = d.plan.filter(p => p.id !== back.id); delete d.done[back.id]; const i = d.plan.findIndex(p => p.id === step.id); d.plan.splice(Math.max(0, i), 0, back); }
    }
    cur = null; save(ST); home(note);
  }

  function sentItems(idxs, mode) {
    return idxs.map(i => ({ idx: i, he: heText(i), de: deText(i), flow: ($ctx().sentences[i].flow || []), mode: mode }));
  }

  function run(step) {
    const C = $ctx();
    unmount();
    cur = { step: step, t0: Date.now() };
    const u = step.key ? unitByKey(step.key) : null;
    const backIfNotDone = () => { if (cur) { cur = null; home(); } };
    if (step.type === 'diag') {
      const items = [];
      units().filter(x => x.kind === 's').forEach(x => { const pick = shuffle(x.sents).slice(0, 2); sentItems(pick, 'diag').forEach(it => { it.unit = x.key; items.push(it); }); });
      return recite({ title: 'בדיקת מצב', intro: 'אין ציונים. עונים בכנות כדי שהמסלול יתאים לך. כל כרטיס: רואים את העברית, אומרים את המשפט בגרמנית בקול, ואז לוחצים "הצג".', items: shuffle(items), mode: 'diag', mark: true, onFinish: sum => { const by = {}; sum.results.forEach(r => { const o = by[r.item.unit] || (by[r.item.unit] = { n: 0, s: 0 }); o.n++; o.s += r.score; }); finish(step, { byUnit: by, ratio: sum.ratio }); }, onClose: backIfNotDone });
    }
    if (step.type === 'vocab') {
      return C.speakOpen({ title: 'אמרו את המילה בגרמנית', items: C.vocabItems(u.vocab.filter(vi => vm(vi) < 0.85).length >= 3 ? u.vocab.filter(vi => vm(vi) < 0.85) : u.vocab), onFinish: sum => finish(step, { sum: sum }), onClose: backIfNotDone });
    }
    if (step.type === 'analyze') {
      return C.speakOpen({ title: 'השלימו את המילה החסרה', items: clozeItems(u), onResult: function () {}, onFinish: sum => finish(step, { sum: sum }), onClose: backIfNotDone });
    }
    if (step.type === 'read') {
      return recite({ title: 'הבנה · ' + u.name, intro: 'מקשיבים למשפט ורואים מילה אחר מילה מה כל חלק עושה. כשהכול ברור, לוחצים "הבנתי".', items: sentItems(u.sents, 'understand'), mode: 'understand', onFinish: sum => finish(step, { ratio: sum.ratio }), onClose: backIfNotDone });
    }
    if (step.type === 'apply') {
      return recite({ title: 'יישום · ' + u.name, intro: 'רואים את המשמעות בעברית. אומרים את המשפט בגרמנית בקול, ואז "הצג" כדי לבדוק.', items: sentItems(shuffle(u.sents), 'apply'), mode: 'apply', mark: 'up', onFinish: sum => finish(step, { ratio: sum.ratio }), onClose: backIfNotDone });
    }
    if (step.type === 'evaluate') {
      // the unit's own sentences, with a few from units that are already done mixed in
      const old = []; units().forEach(x => { if (x.kind === 's' && x !== u && us(x.key).done[5]) x.sents.forEach(i => old.push(i)); });
      const idxs = u.sents.concat(shuffle(old).slice(0, 3));
      return recite({ title: 'הערכה · ' + u.name, intro: 'בלי עזרה: רק העברית. אומרים את המשפט בקול, ואז "הצג". כמה משפטים מנושאים קודמים מעורבבים בפנים, כדי לבדוק שהם עדיין שם.', items: sentItems(shuffle(idxs), 'eval'), mode: 'eval', mark: true, onFinish: sum => finish(step, { ratio: sum.ratio }), onClose: backIfNotDone, scoreOnly: new Set(u.sents) });
    }
    if (step.type === 'review') {
      if (u.kind === 'w') {
        const idx = shuffle(u.vocab).slice(0, 10);
        return C.speakOpen({ title: 'חזרה · ' + u.name, items: C.vocabItems(idx), onFinish: sum => finish(step, { ratio: sum.total ? sum.firstTry / sum.total : 1 }), onClose: backIfNotDone });
      }
      const kn = ST.sk, idxs = u.sents.slice().sort((a, b) => ((kn[a] === 1) ? 1 : 0) - ((kn[b] === 1) ? 1 : 0) || Math.random() - .5).slice(0, 5);
      return recite({ title: 'חזרה · ' + u.name, intro: 'חזרה קצרה: רק העברית, אתם אומרים בקול.', items: sentItems(idxs, 'eval'), mode: 'eval', mark: true, onFinish: sum => finish(step, { ratio: sum.ratio }), onClose: backIfNotDone });
    }
    if (step.type === 'chain') {
      let pool = u.sents.slice();
      if (pool.length < 3) { const extra = []; units().forEach(x => { if (x.kind === 's' && x !== u) x.sents.forEach(i => extra.push(i)); }); pool = pool.concat(shuffle(extra).slice(0, 3 - pool.length)); }
      pool = shuffle(pool); const chains = [];
      for (let i = 0; i < pool.length; i += 3) chains.push(pool.slice(i, i + 3).length === 1 && chains.length ? null : pool.slice(i, i + 3));
      const items = chains.filter(Boolean).map(ch => ({ idx: ch[0], idxs: ch, mode: 'chain', he: ch.map(heText).join('\n'), de: ch.map(deText).join('\n') }));
      return recite({ title: 'יצירה · ' + u.name, intro: 'כמה משפטים ברצף, כמו שיחה. אומרים את כולם בקול בלי להסתכל, ואז "הצג" כדי לבדוק.', items: items, mode: 'chain', mark: 'up', onFinish: sum => finish(step, { ratio: sum.ratio }), onClose: backIfNotDone });
    }
  }

  // ---------------- recite engine (self-rated) ----------------
  function recite(o) {
    injectCss(); try { if (window.SpeakPractice) window.SpeakPractice.ensureCss(); } catch (e) {}
    const C = $ctx();
    const q = o.items.slice(); let i = 0, results = [], phase = 'ask';
    const root = document.createElement('div'); root.className = 'co-ov'; document.body.appendChild(root);
    const finishNow = () => { root.remove(); if (o.onFinish) o.onFinish(summary()); };
    function summary() {
      const rs = o.scoreOnly ? results.filter(r => r.item.idxs ? true : o.scoreOnly.has(r.item.idx)) : results;
      const n = rs.length || 1, s = rs.reduce((a, r) => a + r.score, 0); return { results: results, ratio: s / n };
    }
    function close() { root.remove(); if (o.onClose) o.onClose(); }
    function draw() {
      if (i >= q.length) {
        if (!results.length) return finishNow();
        const sum = summary(), miss = results.filter(r => r.score < 1);
        root.innerHTML = '<div class="co-wrap"><div class="co-top"><h2>' + esc(o.title) + '</h2><button class="co-x" id="rX">✕</button></div>' + (o.mode === 'understand' ? '<div class="co-score">✓</div>' : '<div class="co-score">' + Math.round(sum.ratio * 100) + '%</div>') + '<div class="co-msg" style="text-align:center">' + (o.mode === 'understand' ? 'עברת על כל המשפטים.' : sum.ratio >= .8 ? 'מצוין!' : sum.ratio >= .5 ? 'בכיוון, יש מה לחזק.' : 'זה מה שבדיקה באה לגלות. משם בונים.') + '</div>' + (miss.length && o.mode !== 'understand' ? '<div class="co-h">מה עוד לא ישב</div><div class="co-miss">' + miss.slice(0, 40).map(r => '<div>' + esc(r.item.de).replace(/\n/g, '<br>') + '</div>').join('') + '</div>' : '') + '<div style="margin-top:14px"><button class="co-go" id="rDone">המשך</button></div></div>';
        root.querySelector('#rX').onclick = close; root.querySelector('#rDone').onclick = finishNow;
        return;
      }
      const it = q[i], pct = Math.round(i / q.length * 100), multi = it.mode === 'chain';
      let card;
      const flowHtml = () => (it.flow && it.flow.length ? '<div class="co-flow">' + it.flow.map(f => '<div><b>' + esc(f.text) + '</b><span>' + esc(f.he || '') + (f.label ? ' · ' + esc(f.label) : '') + '</span></div>').join('') + '</div>' : '');
      const heHtml = t => esc(t).replace(/\n/g, '<br>');
      if (it.mode === 'understand') {
        card = '<div class="co-card rev"><div class="co-de">' + esc(it.de) + '</div><div class="co-small">' + esc(it.he) + '</div>' + flowHtml() + '<div class="co-aux"><button id="rSay">🔊 השמע</button></div></div>';
      } else if (phase === 'ask') {
        card = '<div class="co-card"><div class="co-big">' + heHtml(it.he) + '</div><div class="co-small">' + (multi ? 'אמרו את כל המשפטים ברצף, בגרמנית, בקול' : 'אמרו את זה בגרמנית, בקול') + '</div></div>';
      } else {
        card = '<div class="co-card rev"><div class="co-de">' + heHtml(it.de) + '</div><div class="co-small">' + heHtml(it.he) + '</div><div class="co-aux"><button id="rSay">🔊 השמע</button></div></div>';
      }
      const act = it.mode === 'understand'
        ? '<div class="co-rate"><button class="r" data-s="0">עוד לא ברור</button><button class="g" data-s="1">הבנתי</button></div>'
        : phase === 'ask' ? '<button class="co-btn" id="rShow">הצג</button>' : '<div class="co-rate"><button class="r" data-s="0">לא ידעתי</button><button class="o" data-s="0.5">כמעט</button><button class="g" data-s="1">ידעתי</button></div>';
      root.innerHTML = '<div class="co-wrap"><div class="co-top"><button class="co-x" id="rX">✕</button><div class="co-bar"><i style="width:' + pct + '%"></i></div><span style="font-size:13px;color:var(--ink-soft);direction:ltr">' + i + '/' + q.length + '</span></div><div class="co-h" style="margin-top:12px">' + esc(o.title) + '</div>' + (i === 0 && phase === 'ask' && o.intro ? '<div class="co-msg" style="font-size:14px">' + esc(o.intro) + '</div>' : '') + card + act + '</div>';
      root.querySelector('#rX').onclick = close;
      const sb = root.querySelector('#rSay'); if (sb) sb.onclick = () => C.speakDe(it.de.replace(/\n/g, '. '));
      if (it.mode === 'understand') { root.querySelectorAll('.co-rate button').forEach(b => { b.onclick = () => rate(+b.dataset.s); }); if (C.speakDe && !it.__said) { it.__said = 1; setTimeout(() => C.speakDe(it.de), 150); } }
      else if (phase === 'ask') root.querySelector('#rShow').onclick = () => { phase = 'rev'; draw(); C.speakDe(q[i].de.replace(/\n/g, '. ')); };
      else root.querySelectorAll('.co-rate button').forEach(b => { b.onclick = () => rate(+b.dataset.s); });
      root.scrollTop = 0;
    }
    function rate(score) {
      const it = q[i];
      if (!it.again) results.push({ item: it, score: score });
      const ids = it.idxs || [it.idx];
      if (o.mark) ids.forEach(ix => { if (score === 1) ST.sk[ix] = 1; else if (o.mark === true && ST.sk[ix] === 1 && score === 0) delete ST.sk[ix]; });
      save(ST);
      if (score < 1 && (o.mode === 'apply' || o.mode === 'understand') && !it.again) q.push(Object.assign({}, it, { again: true }));
      i++; phase = 'ask'; draw();
    }
    draw();
  }

  // ---------------- entry banner on the home screen ----------------
  function refreshBanner() {
    const b = document.getElementById('coachBanner');
    if (!b) return;

    b.innerHTML = '<div class="co-banner"><span class="co-bi">🧭</span><div><b>המאמן שלי</b><small>' + (nx ? 'הצעד הבא: ' + esc(nx.title) : 'סיימת להיום') + '</small></div><span class="co-bgo">פתח</span></div>';
    b.firstChild.onclick = () => home();
  }
  function init() {
    if (!window.GERMAN_COACH_CTX) return;
    injectCss(); refreshBanner();
    if (ST.lastOpen !== today()) setTimeout(() => { if (!overlay) home(); }, 700);
  }
  window.GermanCoach = { open: () => home(), init: init, refreshBanner: refreshBanner, _state: () => ST, _units: units, _gen: generate, _cloze: clozeItems };
})();

        m12: { w: 'm', de: 'Gut, aber mein Deutsch ist noch nicht so gut.', he: 'טוב, אבל הגרמנית שלי עוד לא כל כך טובה.', next: ['o8'] },
        o8: { w: 'o', de: 'Doch, du sprichst schon sehr gut!', he: 'בטח שכן, אתה כבר מדבר טוב מאוד!', next: ['m13'] },
        m13: { w: 'm', de: 'Danke, das ist lieb von dir.', he: 'תודה, זה מתוק מצידך.', next: [] }
      }
    }
  ];
  const $ctx = () => window.CONVO_CTX || {};
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && typeof s === 'object') return s; } catch (e) {} return { n: {} }; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} }
  let ST = load(); ST.n = ST.n || {};
  const nid = (c, id) => c.id + ':' + id;
  const stat = (c, id) => { const r = ST.n[nid(c, id)]; return r ? r.s : null; };
  function meIds(c) { return Object.keys(c.nodes).filter(k => c.nodes[k].w === 'm'); }
  function pct(c) { const m = meIds(c); return m.length ? Math.round(m.filter(k => stat(c, k) === 1).length / m.length * 100) : 0; }
  const cls = s => s === null ? 'st-new' : s >= 1 ? 'st-ok' : s > 0 ? 'st-mid' : 'st-bad';
  function say(t) { try { if ($ctx().speakDe) $ctx().speakDe(t); } catch (e) {} }

  const CSS = `
  .cv-wrap { max-width: 560px; margin: 0 auto; padding: 4px 0 40px; }
  .cv-card { background: var(--surface, #fff); border: 2px solid var(--line, #e5e5e5); border-radius: 20px; box-shadow: 0 4px 0 var(--line, #e5e5e5); padding: 14px; margin-bottom: 14px; }
  .cv-card h3 { margin: 0 0 6px; font-size: 19px; font-weight: 800; }
  .cv-card .cv-sub { font-size: 13px; color: var(--ink-soft, #777); margin-bottom: 8px; }
  .cv-bar { height: 12px; border-radius: 8px; background: var(--line, #e5e5e5); overflow: hidden; margin: 6px 0 12px; }
  .cv-bar i { display: block; height: 100%; background: var(--fun-green, #58cc02); border-radius: 8px; }
  .cv-btns { display: flex; gap: 8px; }
  .cv-btn { flex: 1; border: 0; border-radius: 14px; padding: 12px 8px; font: inherit; font-size: 16px; font-weight: 800; color: #fff; cursor: pointer; background: var(--fun-green, #58cc02); box-shadow: 0 4px 0 var(--fun-green-dk, #58a700); }
  .cv-btn.sec { background: var(--surface, #fff); color: inherit; border: 2px solid var(--line, #e5e5e5); box-shadow: 0 3px 0 var(--line, #e5e5e5); }
  .cv-btn:active { transform: translateY(2px); }
  .cv-ov { position: fixed; inset: 0; z-index: 8500; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg, #fff); color: var(--ink, #3c3c3c); padding: max(14px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
  .cv-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .cv-top h2 { margin: 0; font-size: 22px; font-weight: 800; }
  .cv-x { background: none; border: 0; font-size: 26px; line-height: 1; color: var(--ink-soft, #777); padding: 6px 4px; cursor: pointer; }
  .cv-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-soft, #777); margin: 4px 0 12px; }
  .cv-legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-inline-end: 5px; vertical-align: -1px; }
  /* the tree */
  .cv-bubble { background: var(--accent-soft, #ddf4ff); border: 2px solid var(--fun-blue, #1cb0f6); border-radius: 18px; padding: 10px 12px; margin: 0; cursor: pointer; }
  .cv-bubble .cv-who, .cv-opt .cv-who { font-size: 11px; font-weight: 800; letter-spacing: .3px; opacity: .7; margin-bottom: 2px; }
  .cv-de { direction: ltr; text-align: left; font-weight: 800; font-size: 16px; line-height: 1.35; }
  .cv-he { font-size: 13px; color: var(--ink-soft, #777); margin-top: 3px; }
  .cv-opt { background: var(--surface, #fff); border: 2px solid var(--line, #e5e5e5); border-inline-start-width: 8px; border-radius: 16px; padding: 10px 12px; }
  .cv-opt.st-ok { border-color: var(--fun-green, #58cc02); background: #eafbd6; }
  .cv-opt.st-mid { border-color: var(--fun-orange, #ff9600); background: #fff3dc; }
  .cv-opt.st-bad { border-color: var(--fun-red, #ff4b4b); background: #ffe5e5; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .cv-opt.st-ok, :root:not([data-theme="light"]) .cv-msg.m { background: #1f3a12; }
    :root:not([data-theme="light"]) .cv-opt.st-mid { background: #44300c; }
    :root:not([data-theme="light"]) .cv-opt.st-bad { background: #4a1b1b; }
  }
  :root[data-theme="dark"] .cv-opt.st-ok, :root[data-theme="dark"] .cv-msg.m { background: #1f3a12; }
  :root[data-theme="dark"] .cv-opt.st-mid { background: #44300c; }
  :root[data-theme="dark"] .cv-opt.st-bad { background: #4a1b1b; }
  .cv-arrow { text-align: center; color: var(--ink-soft, #999); font-size: 18px; line-height: 1; margin: 3px 0; }
  .cv-fork { margin: 6px 0 0; margin-inline-start: 8px; border-inline-start: 3px solid var(--line, #d8d8d8); }
  .cv-branch { position: relative; padding-inline-start: 14px; padding-top: 4px; margin: 6px 0 10px; }
  .cv-branch::before { content: ''; position: absolute; inset-inline-start: 0; top: 24px; width: 12px; height: 3px; background: var(--line, #d8d8d8); }
  .cv-ref { font-size: 12.5px; color: var(--ink-soft, #777); text-align: center; border: 2px dashed var(--line, #ddd); border-radius: 12px; padding: 6px; margin: 4px 0; direction: ltr; }
  .cv-end { text-align: center; font-size: 12.5px; color: var(--ink-soft, #888); margin: 6px 0; }
  .cv-hint { font-size: 12.5px; color: var(--ink-soft, #777); margin: 4px 0 10px; }
  /* walking a conversation */
  .cv-chat { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
  .cv-msg { max-width: 86%; border-radius: 18px; padding: 9px 12px; }
  .cv-msg.o { align-self: flex-start; background: var(--accent-soft, #ddf4ff); border: 2px solid var(--fun-blue, #1cb0f6); }
  .cv-msg.m { align-self: flex-end; background: #eafbd6; border: 2px solid var(--fun-green, #58cc02); }
  .cv-msg.cur { max-width: 100%; align-self: stretch; padding: 14px; }
  .cv-msg.cur .cv-de { font-size: 21px; }
  .cv-say { margin-inline-start: 8px; border: 2px solid var(--line, #e5e5e5); background: var(--surface, #fff); border-radius: 12px; padding: 4px 10px; font-size: 16px; cursor: pointer; }
  .cv-prompt { text-align: center; font-size: 15px; color: var(--ink-soft, #777); margin: 14px 0 10px; }
  .cv-pick { display: block; width: 100%; text-align: start; font: inherit; color: inherit; cursor: pointer; margin: 0 0 10px; }
  .cv-pick.star { border-style: dashed; }
  .cv-pick.dim { opacity: .35; }
  .cv-rate { display: flex; gap: 8px; margin-top: 10px; }
  .cv-rate button { flex: 1; border: 0; border-radius: 14px; padding: 12px 4px; font: inherit; font-size: 15px; font-weight: 800; color: #fff; cursor: pointer; }
  .cv-rate .g { background: var(--fun-green, #58cc02); box-shadow: 0 4px 0 var(--fun-green-dk, #58a700); }
  .cv-rate .o { background: var(--fun-orange, #ff9600); box-shadow: 0 4px 0 #d97f00; }
  .cv-rate .r { background: var(--fun-red, #ff4b4b); box-shadow: 0 4px 0 #ea2b2b; }
  .cv-score { font-size: 52px; font-weight: 800; text-align: center; color: var(--fun-blue, #1cb0f6); direction: ltr; }
  `;
  function injectCss() { if (document.getElementById('cvCss')) return; const s = document.createElement('style'); s.id = 'cvCss'; s.textContent = CSS; document.head.appendChild(s); }

  // ---------------- list ----------------
  function render() {
    injectCss();
    const el = document.getElementById('view-convo'); if (!el) return;
    let h = '<div class="cv-wrap"><div class="cv-hint" style="font-size:14px">שיחה אמיתית מתפצלת. בוחרים איך להמשיך, ורואים על העץ אילו ענפים כבר שלך.</div>';
    CONVOS.forEach(c => {
      const m = meIds(c), p = pct(c), tried = m.filter(k => stat(c, k) !== null).length;
      h += '<div class="cv-card"><h3>' + c.icon + ' ' + esc(c.title) + '</h3><div class="cv-sub">' + m.length + ' תשובות אפשריות · ניסית ' + tried + ' · שלך ' + p + '%</div><div class="cv-bar"><i style="width:' + p + '%"></i></div><div class="cv-btns"><button class="cv-btn" data-a="walk" data-c="' + c.id + '">התחל שיחה</button><button class="cv-btn sec" data-a="map" data-c="' + c.id + '">🌳 העץ</button></div></div>';
    });
    el.innerHTML = h + '</div>';
    el.querySelectorAll('button[data-a]').forEach(b => { b.onclick = () => { const c = CONVOS.find(x => x.id === b.dataset.c); if (b.dataset.a === 'map') openMap(c); else walk(c, c.start, null); }; });
  }

  // ---------------- the tree ----------------
  function treeHtml(c, id, seen) {
    const n = c.nodes[id];
    if (seen.has(id)) return '<div class="cv-ref">↪ ממשיך כמו למעלה: ' + esc(n.de.length > 34 ? n.de.slice(0, 34) + '…' : n.de) + '</div>';
    seen.add(id);
    const s = n.w === 'm' ? stat(c, id) : null;
    let h = n.w === 'o'
      ? '<div class="cv-bubble" data-start="' + id + '"><div class="cv-who">בן השיח</div><div class="cv-de">' + esc(n.de) + '</div><div class="cv-he">' + esc(n.he) + '</div></div>'
      : '<div class="cv-opt ' + cls(s) + '"><div class="cv-who">אתה</div><div class="cv-de">' + esc(n.de) + '</div><div class="cv-he">' + esc(n.he) + '</div></div>';
    const nx = n.next || [];
    if (!nx.length) return h + '<div class="cv-end">⬤ סוף השיחה</div>';
    if (nx.length === 1) return h + '<div class="cv-arrow">↓</div>' + treeHtml(c, nx[0], seen);
    return h + '<div class="cv-fork">' + nx.map(i => '<div class="cv-branch">' + treeHtml(c, i, seen) + '</div>').join('') + '</div>';
  }
  function openMap(c) {
    injectCss();
    const ov = document.createElement('div'); ov.className = 'cv-ov'; document.body.appendChild(ov);
    const draw = () => {
      ov.innerHTML = '<div class="cv-wrap"><div class="cv-top"><h2>' + c.icon + ' ' + esc(c.title) + '</h2><button class="cv-x" id="cvX">✕</button></div>' +
        '<div class="cv-legend"><span><i style="background:#ccc"></i>לא ניסית</span><span><i style="background:var(--fun-red,#ff4b4b)"></i>לא ידעת</span><span><i style="background:var(--fun-orange,#ff9600)"></i>כמעט</span><span><i style="background:var(--fun-green,#58cc02)"></i>שלך</span></div>' +
        '<div class="cv-hint">הקישו על בועה של בן השיח כדי להתחיל את השיחה משם.</div>' + treeHtml(c, c.start, new Set()) +
        '<div class="cv-btns" style="margin-top:18px"><button class="cv-btn" id="cvGo">התחל שיחה</button></div></div>';
      ov.querySelector('#cvX').onclick = () => { ov.remove(); render(); };
      ov.querySelector('#cvGo').onclick = () => { ov.remove(); walk(c, c.start, null); };
      ov.querySelectorAll('.cv-bubble').forEach(b => { b.onclick = () => { ov.remove(); walk(c, b.dataset.start, null); }; });
    };
    draw();
  }

  // ---------------- walking a conversation ----------------
  function routeTo(c, from, target) {
    const par = {}, q = [from]; par[from] = null;
    while (q.length) { const x = q.shift(); if (x === target) break; (c.nodes[x].next || []).forEach(y => { if (!(y in par)) { par[y] = x; q.push(y); } }); }
    if (!(target in par)) return new Set();
    const out = new Set(); let x = target; while (x) { out.add(x); x = par[x]; } return out;
  }
  function pickTarget(c) {
    const m = meIds(c).filter(k => stat(c, k) !== 1);
    if (!m.length) return null;
    const never = m.filter(k => stat(c, k) === null);
    const pool = never.length ? never : m;
    return pool[Math.floor(Math.random() * pool.length)];
  }
  function walk(c, startId, target) {
    injectCss();
    const route = target ? routeTo(c, c.start, target) : new Set();
    const ov = document.createElement('div'); ov.className = 'cv-ov'; document.body.appendChild(ov);
    Object.keys(c.nodes).forEach(k => { delete c.nodes[k].__said; });
    let cur = startId, phase = 'ask', chat = [], picked = null, showHe = false, rated = [];
    const close = () => { ov.remove(); render(); };
    function drawChat() { return chat.map(m => '<div class="cv-msg ' + m.w + '"><div class="cv-de">' + esc(m.de) + '</div><div class="cv-he">' + esc(m.he) + '</div></div>').join(''); }
    function finish() {
      const g = rated.filter(r => r === 1).length, n = rated.length || 1;
      const nextT = pickTarget(c);
      ov.innerHTML = '<div class="cv-wrap"><div class="cv-top"><h2>' + c.icon + ' ' + esc(c.title) + '</h2><button class="cv-x" id="cvX">✕</button></div><div class="cv-chat">' + drawChat() + '</div><div class="cv-score">' + g + '/' + rated.length + '</div><div class="cv-prompt">' + (g === n ? 'השיחה הזאת כבר שלך.' : 'ככה בונים שיחה: כל פעם עוד ענף.') + ' בעץ כולו שלך ' + pct(c) + '%.</div>' +
        '<div class="cv-btns" style="flex-direction:column">' + (nextT ? '<button class="cv-btn" id="cvNew">ענף חדש ←</button>' : '') + '<button class="cv-btn sec" id="cvAgain">שיחה מההתחלה</button><button class="cv-btn sec" id="cvMap">🌳 העץ</button></div></div>';
      ov.querySelector('#cvX').onclick = close;
      const nb = ov.querySelector('#cvNew'); if (nb) nb.onclick = () => { ov.remove(); walk(c, c.start, nextT); };
      ov.querySelector('#cvAgain').onclick = () => { ov.remove(); walk(c, c.start, null); };
      ov.querySelector('#cvMap').onclick = () => { ov.remove(); openMap(c); };
    }
    function draw() {
      const n = c.nodes[cur];
      let h = '<div class="cv-wrap"><div class="cv-top"><h2>' + c.icon + ' ' + esc(c.title) + '</h2><button class="cv-x" id="cvX">✕</button></div>';
      if (target && !chat.length) h += '<div class="cv-hint">⭐ ענף חדש: אחת האפשרויות מסומנת בכוכב. נסו אותה.</div>';
      h += '<div class="cv-chat">' + drawChat() + '<div class="cv-msg o cur"><div class="cv-who" style="font-size:11px;font-weight:800;opacity:.7">בן השיח</div><div class="cv-de">' + esc(n.de) + '<button class="cv-say" id="cvSay" aria-label="השמע">🔊</button></div>' + (showHe ? '<div class="cv-he">' + esc(n.he) + '</div>' : '<div class="cv-he"><a href="#" id="cvHe" style="color:inherit">הצג תרגום</a></div>') + '</div></div>';
      if (phase === 'ask') {
        h += '<div class="cv-prompt">אמרו בקול איך הייתם עונים</div><div class="cv-btns"><button class="cv-btn" id="cvShow">הצג אפשרויות</button></div>';
      } else {
        h += '<div class="cv-prompt">' + (picked ? 'איך זה יצא לך?' : 'באיזו אפשרות הלכתם?') + '</div>';
        (n.next || []).forEach(id => {
          const o = c.nodes[id], st = stat(c, id), isP = picked === id, dim = picked && !isP;
          h += '<div class="cv-opt cv-pick ' + cls(st) + (route.has(id) && !picked ? ' star' : '') + (dim ? ' dim' : '') + '" data-id="' + id + '"><div class="cv-who">אתה' + (route.has(id) && !picked ? ' · ⭐ ענף חדש' : '') + '</div><div class="cv-de">' + esc(o.de) + '<button class="cv-say" data-say="' + id + '" aria-label="השמע">🔊</button></div><div class="cv-he">' + esc(o.he) + '</div>' +
            (isP ? '<div class="cv-rate"><button class="r" data-s="0">לא ידעתי</button><button class="o" data-s="0.5">כמעט</button><button class="g" data-s="1">ידעתי</button></div>' : '') + '</div>';
        });
      }
      ov.innerHTML = h + '</div>';
      ov.querySelector('#cvX').onclick = close;
      ov.querySelector('#cvSay').onclick = () => say(n.de);
      const he = ov.querySelector('#cvHe'); if (he) he.onclick = e => { e.preventDefault(); showHe = true; draw(); };
      const sh = ov.querySelector('#cvShow'); if (sh) sh.onclick = () => { phase = 'pick'; draw(); };
      ov.querySelectorAll('[data-say]').forEach(b => { b.onclick = e => { e.stopPropagation(); say(c.nodes[b.dataset.say].de); }; });
      ov.querySelectorAll('.cv-pick').forEach(card => { card.onclick = e => { if (e.target.closest('.cv-rate')) return; if (!picked) { picked = card.dataset.id; draw(); } }; });
      ov.querySelectorAll('.cv-rate button').forEach(b => { b.onclick = () => rate(+b.dataset.s); });
      if (!n.__said) { n.__said = true; setTimeout(() => say(n.de), 150); }
    }
    function rate(score) {
      const id = picked, o = c.nodes[id];
      const r = ST.n[nid(c, id)] || { s: null, n: 0 }; r.s = score; r.n++; ST.n[nid(c, id)] = r; save();
      rated.push(score);
      chat.push({ w: 'o', de: c.nodes[cur].de, he: c.nodes[cur].he }); chat.push({ w: 'm', de: o.de, he: o.he });
      Object.keys(c.nodes).forEach(k => { delete c.nodes[k].__said; });
      picked = null; phase = 'ask'; showHe = false;
      const nx = (o.next || [])[0];
      if (!nx) return finish();
      cur = nx; draw();
    }
    draw();
  }

  function init() { injectCss(); }
  window.Convo = { render: render, init: init, _convos: CONVOS, _state: () => ST, _reload: () => { ST = load(); ST.n = ST.n || {}; } };
})();

</script>

<script>
(function () {
  var KEY = 'delearn_fun', root = document.documentElement;
  function get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function apply(on) { root.classList.toggle('fun', on); try { var m = document.querySelector('meta[name="theme-color"]'); if (m) { if (!m.dataset.orig) m.dataset.orig = m.getAttribute('content'); m.setAttribute('content', on ? '#58CC02' : m.dataset.orig); } } catch (e) {} }
  apply(get() !== '0');
  document.addEventListener('DOMContentLoaded', function () {
    var panel = document.getElementById('settingsPanel'); if (!panel || document.getElementById('funOn')) return;
    var row = document.createElement('div'); row.className = 'settings-row';
    row.innerHTML = '<label>עיצוב</label><div class="speed-group"><button class="speed-btn" id="funOn">כיפי</button><button class="speed-btn" id="funOff">קלאסי</button></div>';
    panel.insertBefore(row, panel.firstChild);
    function mark() { var on = root.classList.contains('fun'); document.getElementById('funOn').classList.toggle('selected', on); document.getElementById('funOff').classList.toggle('selected', !on); }
    document.getElementById('funOn').onclick = function () { try { localStorage.setItem(KEY, '1'); } catch (e) {} apply(true); mark(); };
    document.getElementById('funOff').onclick = function () { try { localStorage.setItem(KEY, '0'); } catch (e) {} apply(false); mark(); };
    mark();
  });
})();
</script>

  --bg: #131F24; --surface: #1F2C34; --ink: #F1F7FB; --ink-soft: #9DB0BB;
  --accent: #49C0F8; --accent-soft: #1B3A4B; --line: #37464F; --fun-shade: #0B1215;
  --fun-ok-bg: #243F14; --fun-bad-bg: #4A2222;
  --tag-1: #FFB43F; --tag-2: #8FE04A; --tag-3: #FF8A8A; --tag-4: #49C0F8; --tag-5: #D9A5FF;
  --tag-1-bg: #3B2C12; --tag-2-bg: #22361A; --tag-3-bg: #3F2020; --tag-4-bg: #17394A; --tag-5-bg: #35244A;
}

html.fun body, html.fun body *:not(pre):not(code) { font-family: 'Rubik', 'Heebo', sans-serif !important; }
html.fun body { background: var(--bg); }
html.fun .wrap { padding-top: 22px; }

/* header */
html.fun h1 { font-weight: 800; font-size: 30px; color: var(--fun-green); letter-spacing: 0; }
html.fun .sub { font-weight: 500; font-size: 14px; }
html.fun .settings-toggle, html.fun .head-actions button {
  border: 2px solid var(--line); border-radius: 14px; box-shadow: 0 3px 0 var(--fun-shade); background: var(--surface);
  color: var(--ink-soft); font-weight: 700; padding: 7px 12px;
}

/* tabs -> chunky chips */
html.fun .tabs { border-bottom: 0; gap: 8px; padding: 2px 2px 8px; margin: 16px -2px 14px; }
html.fun .tab {
  border: 2px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: 0 3px 0 var(--fun-shade);
  padding: 8px 14px; font-weight: 700; color: var(--ink-soft);
}
html.fun .tab.active { background: var(--fun-green); border-color: var(--fun-green); box-shadow: 0 3px 0 var(--fun-green-dk); color: #fff; }
html.fun .tab.active::after { display: none; }
html.fun .tab:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--fun-shade); }

/* views pop in */
html.fun .view.active { animation: funPop .32s cubic-bezier(.2,.9,.3,1.2); }
@keyframes funPop { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }

/* chunky buttons */
html.fun .nav-btn, html.fun .test-btn, html.fun .kp-btn, html.fun .kseg button, html.fun .speed-btn, html.fun .cw-umlaut-btn,
html.fun .cw-zoom-btn, html.fun .kater-know-btn, html.fun .kater-unknow-btn, html.fun .kater-reveal-btn, html.fun .kater-vocab-jump-btn,
html.fun .kater-audio-part-btn, html.fun .kater-audio-mark-btn, html.fun .kater-audio-clear-btn, html.fun .flow-link-btn, html.fun .ext-link,
html.fun .daily-focus-btn, html.fun .note-save-btn, html.fun .note-edit-btn, html.fun .mnem-clear-btn, html.fun .kater-note-add, html.fun .weak-toggle-row button, html.fun .game-selector button {
  border: 2px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--fun-blue-dk);
  box-shadow: 0 4px 0 var(--fun-shade); font-weight: 700; padding-top: 11px; padding-bottom: 11px; transition: transform .08s, box-shadow .08s;
}
html.fun .nav-btn:active, html.fun .test-btn:active, html.fun .kp-btn:active, html.fun .kseg button:active, html.fun .speed-btn:active,
html.fun .kater-know-btn:active, html.fun .kater-unknow-btn:active, html.fun .kater-reveal-btn:active, html.fun .daily-focus-btn:active {
  transform: translateY(3px); box-shadow: 0 1px 0 var(--fun-shade); opacity: 1;
}
html.fun .nav-btn.active-toggle, html.fun .kseg button.on, html.fun .speed-btn.selected, html.fun .kater-audio-part-btn.on, html.fun .selected {
  background: var(--accent-soft); border-color: var(--fun-blue); color: var(--fun-blue-dk); box-shadow: 0 4px 0 var(--fun-blue);
}
html.fun .kseg { background: transparent; padding: 0; gap: 8px; }
html.fun .kseg button { box-shadow: 0 4px 0 var(--fun-shade); }
html.fun .kseg button.on { box-shadow: 0 4px 0 var(--fun-blue); }
html.fun .kater-know-btn { background: var(--fun-green); border-color: var(--fun-green); color: #fff; box-shadow: 0 4px 0 var(--fun-green-dk); }
html.fun .kater-unknow-btn { color: var(--fun-red-dk); }
html.fun .kater-reveal-btn, html.fun .daily-focus-btn, html.fun .note-save-btn { background: var(--fun-blue); border-color: var(--fun-blue); color: #fff; box-shadow: 0 4px 0 var(--fun-blue-dk); }
html.fun .kp-play, html.fun .kater-audio-play-btn { background: var(--fun-green); border-color: var(--fun-green); color: #fff; box-shadow: 0 4px 0 var(--fun-green-dk); }

/* round speaker buttons */
html.fun .play-btn, html.fun .play-btn-sm, html.fun .grid-card-speak, html.fun .flow-speak-btn {
  border: 0; background: var(--fun-blue); color: #fff; box-shadow: 0 3px 0 var(--fun-blue-dk); transition: transform .08s, box-shadow .08s;
}
html.fun .play-btn:active, html.fun .play-btn-sm:active { transform: translateY(2px) scale(.97); box-shadow: 0 1px 0 var(--fun-blue-dk); }
html.fun .play-btn.speaking { background: var(--fun-green); box-shadow: 0 3px 0 var(--fun-green-dk); color: #fff; animation: funPulse .9s infinite; }
@keyframes funPulse { 50% { transform: scale(1.1); } }

/* cards */
html.fun .sentence-row, html.fun .kater-line-card, html.fun .check-card, html.fun .settings-panel, html.fun .home-tile, html.fun .home-row,
html.fun .daily-focus-card, html.fun .routine-step, html.fun .kq-card, html.fun .kater-flat-card, html.fun .mnem-card, html.fun .note-panel,
html.fun .verb-item, html.fun .progress-item, html.fun .gender-card, html.fun .kater-practice-card, html.fun .streak-gameover,
html.fun .memory-card, html.fun .flow-item, html.fun .kater-scene-summary, html.fun .scenes-summary, html.fun .kater-audio-bar {
  border: 2px solid var(--line); border-radius: 18px; box-shadow: 0 4px 0 var(--fun-shade); background: var(--surface);
}
html.fun .home-list { background: none; border: 0; border-radius: 0; overflow: visible; display: flex; flex-direction: column; gap: 10px; }
html.fun .home-row { padding: 12px 14px; }
html.fun .home-tile, html.fun .home-row { transition: transform .08s, box-shadow .08s; }
html.fun .home-tile:active, html.fun .home-row:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--fun-shade); background: var(--surface); opacity: 1; }
html.fun .home-tile-icon, html.fun .home-row-icon { filter: drop-shadow(0 2px 0 rgba(0,0,0,.08)); }
html.fun .home-row-icon { background: var(--accent-soft); border-radius: 14px; }
html.fun .home-row-label, html.fun .home-tile-label { font-weight: 700; }
html.fun .home-group-title { font-weight: 800; color: var(--ink-soft); letter-spacing: .02em; }
html.fun .home-hello { font-weight: 800; }
html.fun .vocab-row { border: 2px solid var(--line); border-radius: 16px; box-shadow: 0 3px 0 var(--fun-shade); padding: 10px 12px; margin-bottom: 9px; }
html.fun .flashcard-face { border: 2px solid var(--line); border-radius: 22px; box-shadow: 0 5px 0 var(--fun-shade); }
html.fun .flashcard-back { background: var(--accent-soft); border-color: var(--fun-blue); box-shadow: 0 5px 0 var(--fun-blue); }
html.fun .kater-flat-card { border-radius: 22px; box-shadow: 0 5px 0 var(--fun-shade); }
html.fun .kater-line-card.kater-line-highlight { box-shadow: 0 4px 0 var(--fun-green-dk); border-color: var(--fun-green); }
html.fun .sync-active { background: var(--fun-ok-bg); border-radius: 12px; }

/* inputs */
html.fun input[type=text], html.fun input[type=search], html.fun input:not([type]), html.fun textarea, html.fun select,
html.fun .global-search-input, html.fun .check-input, html.fun .note-input, html.fun .mnem-note-input, html.fun .kater-scene-select, html.fun .vocab-category-select {
  border: 2px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); font-weight: 500;
}
html.fun input:focus, html.fun textarea:focus, html.fun select:focus { outline: none; border-color: var(--fun-blue); box-shadow: 0 0 0 3px rgba(28,176,246,.2); }

/* badges and tags */
html.fun .category-title, html.fun .search-section-title, html.fun .grammar-section-title { font-weight: 800; border-radius: 12px; padding: 4px 12px; }
html.fun .vocab-pos, html.fun .gender-tag { font-weight: 700; border-radius: 10px; }

/* quiz / games */
html.fun .kq-option, html.fun .mc-option, html.fun .puzzle-chip {
  border: 2px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 4px 0 var(--fun-shade); font-weight: 600; color: var(--ink);
}
html.fun .kq-option:active, html.fun .mc-option:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--fun-shade); background: var(--surface); }
html.fun .kq-option.kq-correct, html.fun .mc-option.mc-correct { background: var(--fun-ok-bg); border-color: var(--fun-green); color: var(--fun-green-dk); box-shadow: 0 4px 0 var(--fun-green); animation: funBounce .4s; }
html.fun .kq-option.kq-wrong, html.fun .mc-option.mc-wrong { background: var(--fun-bad-bg); border-color: var(--fun-red); color: var(--fun-red-dk); box-shadow: 0 4px 0 var(--fun-red); animation: funShake .4s; }
@keyframes funBounce { 0%,100% { transform: scale(1); } 40% { transform: scale(1.04); } }
@keyframes funShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
html.fun .check-result-correct, html.fun .cw-result-correct, html.fun .puzzle-result-correct { background: var(--fun-ok-bg); border-radius: 16px; color: var(--fun-green-dk); font-weight: 700; }
html.fun .check-result-wrong, html.fun .cw-result-wrong, html.fun .puzzle-result-wrong { background: var(--fun-bad-bg); border-radius: 16px; color: var(--fun-red-dk); font-weight: 700; }

/* progress bits */
html.fun .kq-progress, html.fun .sequence-bar, html.fun .cw-level-progress { border-radius: 999px; }
html.fun .progress-dot { border-radius: 50%; }
html.fun .routine-streak { font-weight: 800; color: var(--fun-orange); }

/* speaking test: use the same tokens */
html.fun .sp-overlay { background: var(--bg); }
html.fun .sp-card { box-shadow: 0 6px 0 var(--fun-shade); }
html.fun .sp-card.ok { animation: funBounce .45s; }
html.fun .sp-mic, html.fun .sp-next, html.fun .sp-type button { font-weight: 800; }
html.fun .sp-chip { box-shadow: 0 4px 0 var(--fun-shade); }
html.fun .sp-chip.on { box-shadow: 0 4px 0 var(--fun-blue); }
html.fun .sp-title { font-weight: 800; }

@media (prefers-reduced-motion: reduce) { html.fun * { animation: none !important; transition: none !important; } }

/* hero buttons + bottom audio bar */
html.fun button[onclick*="Speak"] { background: var(--fun-green); border-color: var(--fun-green); color: #fff; box-shadow: 0 4px 0 var(--fun-green-dk); }
html.fun button[onclick*="Speak"]:active { box-shadow: 0 1px 0 var(--fun-green-dk); }
html.fun .kater-audio-bar { border-radius: 20px 20px 0 0; border-bottom: 0; box-shadow: 0 -2px 0 var(--fun-shade); }
html.fun .sp-card.ok { background: var(--fun-ok-bg); border-color: var(--fun-green); color: var(--tag-2); box-shadow: 0 6px 0 var(--fun-green); }
html.fun .sp-card.bad, html.fun .sp-card.wrongtry { background: var(--fun-bad-bg); border-color: var(--fun-red); color: var(--tag-3); box-shadow: 0 6px 0 var(--fun-red); }
html.fun .sp-banner { background: var(--fun-bad-bg); border-color: var(--fun-red); color: var(--tag-3); }
html.fun .sp-mic.live { box-shadow: 0 5px 0 #bd3a3e; }
</style>
<!--FUN-END-->
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-row">
      <div>
        <h1>לומדים גרמנית</h1>

      </div>
      <div class="head-actions">
        <button class="settings-toggle" id="homeBtn" onclick="switchTab('home')" aria-label="מסך בית">🏠 בית</button>
        <button class="settings-toggle" id="settingsToggle">⚙ קול</button>
      </div>
    </div>
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-row">

      </div>
      <div class="settings-row">
        <label>מהירות דיבור</label>

          <button class="speed-btn" data-rate="0.8">איטי</button>

      </div>

      <div class="settings-row" style="margin-top:16px; border-top:1px solid var(--line); padding-top:12px;">

          <button class="speed-btn" id="exportBtn">ייצוא</button>
          <button class="speed-btn" id="importBtn">ייבוא</button>

        <div id="katerMovePanel" style="display:none; margin-top:8px;"></div>

<script>
  const SENTENCES = [
    { he: "איך ישנת?", de: "Wie hast du geschlafen?", category: "בוקר", flow: [
      { text: "Wie", label: "מילת שאלה", type: "other", he: "איך" },
      { text: "hast", label: "עזר (haben)", type: "verb", he: "יש (ל-)", why: "haben הוא פועל העזר שבונה יחד עם צורת העבר (geschlafen) את זמן ה-Perfekt — הזמן הרגיל לדיבור על העבר בגרמנית מדוברת." },
      { text: "du", label: "כינוי גוף", type: "pron", he: "אתה / את" },
      { text: "geschlafen", label: "פועל (עבר)", type: "verb", he: "ישנת (עבר של schlafen)", why: "זו צורת ה-Partizip II של schlafen. היא חייבת לבוא יחד עם hast/hat/habe וכו' — לא אומרים אותה לבד." },
    ]},
    { he: "אני אוכל ארוחת בוקר", de: "Ich frühstücke.", category: "בוקר", flow: [
      { text: "Ich", label: "כינוי גוף", type: "pron", he: "אני" },
      { text: "frühstücke", label: "פועל", type: "verb", he: "אוכל ארוחת בוקר" },
    ]},
    { he: "אני הולך להתארגן", de: "Ich mache mich fertig.", category: "יציאה מהבית", flow: [
      { text: "Ich", label: "כינוי גוף", type: "pron", he: "אני" },
      { text: "mache", label: "פועל", type: "verb", he: "עושה" },
      { text: "mich", label: "רפלקסיבי", type: "refl", he: "את עצמי", why: "sich fertig machen הוא פועל רפלקסיבי — הפועל 'מתחבר' חזרה לנושא. בלי mich המשפט לא שלם דקדוקית, גם אם כל שאר המילים נכונות." },
      { text: "fertig", label: "משלים", type: "other", he: "מוכן" },
    ]},
    { he: "אני צריך ללכת", de: "Ich muss gehen.", category: "יציאה מהבית", flow: [
      { text: "Ich", label: "כינוי גוף", type: "pron", he: "אני" },
      { text: "muss", label: "פועל מודלי", type: "modal", he: "חייב / צריך", why: "muss (מ-müssen) הוא פועל מודלי. פעלים מודליים דוחפים את הפועל הראשי (כאן gehen) לצורת המקור שלו, בסוף המשפט." },
      { text: "gehen", label: "פועל (מקור)", type: "verb", he: "ללכת" },
    ]},
    { he: "אני בדרך", de: "Ich bin unterwegs.", category: "יציאה מהבית", flow: [
      { text: "Ich", label: "כינוי גוף", type: "pron", he: "אני" },
      { text: "bin", label: "פועל (sein)", type: "verb", he: "נמצא (אני)" },
      { text: "unterwegs", label: "תואר הפועל", type: "other", he: "בדרך" },
    ]},
    { he: "אני עייף", de: "Ich bin müde.", category: "הרגשה", flow: [
      { text: "Ich", label: "כינוי גוף", type: "pron", he: "אני" },
      { text: "bin", label: "פועל (sein)", type: "verb", he: "נמצא (אני)" },
      { text: "müde", label: "תואר", type: "other", he: "עייף" },
    ]},
    { he: "אני מרגיש טוב", de: "Ich fühle mich gut.", category: "הרגשה", flow: [
      { text: "Ich", label: "כינוי גוף", type: "pron", he: "אני" },
      { text: "fühle", label: "פועל", type: "verb", he: "מרגיש" },
      { text: "mich", label: "רפלקסיבי", type: "refl", he: "את עצמי", why: "sich fühlen הוא פועל רפלקסיבי, בדיוק כמו sich fertig machen שכבר ראית. בלי mich זה לא משפט תקין בגרמנית." },
      { text: "gut", label: "תואר הפועל", type: "other", he: "טוב" },

    { he: "אני אניח את הראש ל-20 דקות", de: "Ich mache ein 20-minütiges Nickerchen.", category: "מנוחה", flow: [

      { text: "mache", label: "פועל", type: "verb", he: "עושה" },
      { text: "ein 20-minütiges", label: "תווית + תואר", type: "other", he: "בת 20 דקות" },
      { text: "Nickerchen", label: "שם עצם", type: "other", he: "תנומה קצרה" },

    { he: "אני הולך להתאמן בחדר כושר", de: "Ich gehe ins Fitnessstudio.", category: "כושר וספורט", flow: [

      { text: "gehe", label: "פועל", type: "verb", he: "הולך" },
      { text: "ins", label: "מילת יחס + תווית", type: "other", he: "לתוך ה-", why: "ins הוא קיצור חובה של in + das, כי Fitnessstudio הוא ניטרלי (das). בגרמנית מדוברת לא אומרים 'in das' בנפרד." },
      { text: "Fitnessstudio", label: "שם עצם", type: "other", he: "חדר כושר" },

    { he: "אני הולך לקנות לעצמי קפה", de: "Ich hole mir einen Kaffee.", category: "קניות ואוכל", flow: [
      { text: "Ich", label: "כינוי גוף", type: "pron", he: "אני" },

  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function routineStorageKey(day) { return `delearn_routine_${day}`; }

  function getRoutineDone(day) {
    try { return JSON.parse(safeGet(routineStorageKey(day), '{"morning":[],"evening":[]}')); }
    catch (e) { return { morning: [], evening: [] }; }
  }

  function setRoutineDone(day, data) { safeSet(routineStorageKey(day), JSON.stringify(data)); }

  let routinePeriod = safeGet('delearn_routine_period', new Date().getHours() < 14 ? 'morning' : 'evening');

  function setRoutinePeriod(period) {
    routinePeriod = period;
    safeSet('delearn_routine_period', period);
    renderRoutine();
  }

  function toggleRoutineStep(period, stepId) {
    const day = todayKey();
    const done = getRoutineDone(day);
    const list = done[period] || [];
    const idx = list.indexOf(stepId);
    if (idx === -1) list.push(stepId); else list.splice(idx, 1);
    done[period] = list;
    setRoutineDone(day, done);
    updateRoutineStreak(done);
    renderRoutine();
  }

  function updateRoutineStreak(doneToday) {
    const bothDone = ROUTINE_STEPS.morning.every(s => doneToday.morning.includes(s.id))
      && ROUTINE_STEPS.evening.every(s => doneToday.evening.includes(s.id));
    if (!bothDone) return;
    const today = todayKey();
    const lastFull = safeGet('delearn_routine_last_full_day', '');
    if (lastFull === today) return;
    const y = new Date(); y.setDate(y.getDate() - 1);
    const yesterdayKey = `${y.getFullYear()}-${String(y.getMonth() + 1).padStart(2, '0')}-${String(y.getDate()).padStart(2, '0')}`;
    const prevStreak = parseInt(safeGet('delearn_routine_streak', '0'), 10) || 0;
    const newStreak = (lastFull === yesterdayKey) ? prevStreak + 1 : 1;
    safeSet('delearn_routine_streak', String(newStreak));
    safeSet('delearn_routine_last_full_day', today);
  }

  function goToRoutineTab(tab) { switchTab(tab); }

  function renderRoutine() {
    const el = document.getElementById('view-routine');
    const day = todayKey();
    const done = getRoutineDone(day);
    const streak = parseInt(safeGet('delearn_routine_streak', '0'), 10) || 0;
    const periodRow = `
      <div class="weak-toggle-row" id="routinePeriodRow">
        <button class="nav-btn${routinePeriod === 'morning' ? ' active-toggle' : ''}" onclick="setRoutinePeriod('morning')">☀️ בוקר</button>
        <button class="nav-btn${routinePeriod === 'evening' ? ' active-toggle' : ''}" onclick="setRoutinePeriod('evening')">🌙 ערב</button>
      </div>`;
    const steps = ROUTINE_STEPS[routinePeriod];
    const doneList = done[routinePeriod] || [];
    const completedCount = steps.filter(s => doneList.includes(s.id)).length;
    const allDone = completedCount === steps.length;
    const streakHtml = streak > 0 ? `<div class="routine-streak">🔥 ${streak} ${streak === 1 ? 'יום ברציפות' : 'ימים ברציפות'} ששתי השגרות הושלמו</div>` : '';
    const summaryHtml = `<div class="routine-summary">${completedCount} / ${steps.length} הושלמו היום${allDone ? ' — כל הכבוד! 🎉' : ''}</div>`;
    const focusSize = Math.min(10, VOCAB.length + SENTENCES.length);
    const dailyFocusHtml = focusSize > 0 ? `
      <div class="daily-focus-card">
        <div class="daily-focus-title">🎯 הסט שלי להיום</div>
        <div class="daily-focus-desc">לא צריך לבחור מאיפה להתחיל — תמהיל קטן של מילים חלשות, דברים חדשים וקצת חזרה, ככרטיסיות אחת-אחת.</div>
        <button class="daily-focus-btn" onclick="startDailyFocus()">▶ התחל (${focusSize} פריטים)</button>
      </div>
      <div class="routine-alt-label">או עברו שלב-שלב:</div>` : '';
    const stepsHtml = steps.map(s => {
      const isDone = doneList.includes(s.id);
      return `
        <div class="routine-step${isDone ? ' routine-step-done' : ''}">
          <div class="routine-step-check" onclick="toggleRoutineStep('${routinePeriod}', '${s.id}')" role="checkbox" aria-checked="${isDone}">${isDone ? '✓' : ''}</div>
          <div class="routine-step-main">
            <div class="routine-step-title">${s.icon} ${escapeHtml(s.title)}</div>
            <div class="routine-step-desc">${escapeHtml(s.desc)}</div>
          </div>
          <button class="nav-btn routine-step-go" onclick="goToRoutineTab('${s.tab}')">עבור ›</button>
        </div>`;
    }).join('');
    el.innerHTML = dailyFocusHtml + periodRow + streakHtml + summaryHtml + stepsHtml;
  }

  function renderSentences() {
    const el = document.getElementById('view-sentences');
    if (SENTENCES.length === 0) {
      el.innerHTML = `<div class="empty"><span class="empty-emoji">✎</span>עדיין אין כאן משפטים.<br>שלחו לי משפט בעברית ואוסיף אותו לכאן, מתורגם ועם שמע.</div>`;
      return;
    }
    const categories = {};
    SENTENCES.forEach(s => {
      const cat = s.category || 'כללי';
      if (!categories[cat]) categories[cat] = [];
      categories[cat].push(s);
    });
    let catNames = Object.keys(categories);
    if (CATEGORY_ORDER.length) {
      catNames.sort((a, b) => {
        const ia = CATEGORY_ORDER.indexOf(a), ib = CATEGORY_ORDER.indexOf(b);
        if (ia === -1 && ib === -1) return a.localeCompare(b, 'he');
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      });
    } else {
      catNames.sort((a, b) => a.localeCompare(b, 'he'));
    }

    el.innerHTML = `
      <div class="sequence-bar">
        <button class="nav-btn" id="sequenceBtn" onclick="toggleSequence()">▶ השמע הכל ברצף</button>
        <span class="sequence-status" id="sequenceStatus"></span>
      </div>
      ` + catNames.map(cat => {
      const idx = tagIndexFor(cat);
      const rows = categories[cat].map((s, i) => {
        const rowId = `s-${cat}-${i}`.replace(/[^a-zA-Z0-9-]/g, '_');
        return `
        <div class="sentence-row">
          <div class="sentence-text">
            <p class="sentence-he">${escapeHtml(s.he)}</p>
            <p class="sentence-de">${escapeHtml(s.de)}</p>
            <div class="ext-links">
              <a class="ext-link" href="${forvoUrl(s.de)}" target="_blank" rel="noopener noreferrer">Forvo</a>
              <a class="ext-link" href="${tatoebaUrl(s.de)}" target="_blank" rel="noopener noreferrer">Tatoeba</a>
            </div>
          </div>
          <button class="play-btn" id="${rowId}" onclick="speak('${escapeJs(s.de)}', '${rowId}')" aria-label="השמע בגרמנית">🔊</button>
        </div>`;
      }).join('');
      return `
        <div class="category">
          <span class="category-title" style="background:var(--tag-${idx+1}-bg); color:var(--tag-${idx+1});">${escapeHtml(cat)}</span>
          ${rows}
        </div>`;
    }).join('');
  }
