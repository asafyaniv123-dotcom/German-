  // <<ASSOC>> ready-made memory associations (sound-alikes, pictures) offered for a word; "pick another" cycles, "keep" saves it as the word's note
  window.ASSOC = {"Tüte": ["נשמע כמו \"טיוטה\": אתה שם טיוטה של מסמך בתוך שקית ויוצא מהסופר.", "Tüte ≈ \"טיול\": לוקחים שקית לטיול, ובה הסנדוויצ'ים.", "תמונה: גברת די (die) סוחבת שקית ענקית וצועקת \"די! היא נקרעת!\""], "Pfand": ["Pfand ≈ \"פנקס\": כסף שרשום על הבקבוק במין פנקס קטן ומחכה שתחזיר אותו.", "באנגלית pawn = משכון, וזה בדיוק Pfand: משאיר משכון על הבקבוק ומקבל אותו בחזרה.", "נשמע כמו \"פנדה\": הפנדה מחזירה בקבוק למכונה ומקבלת עליו כסף."], "Kasse": ["Kasse ≈ cash: מי שמשלם cash עומד ליד ה-Kasse.", "Kasse ≈ \"כספת\": הקופה היא הכספת של הסופר.", "באיטלקית cassa וגם בספרדית caja = קופה, אותו שורש."], "Wechselgeld": ["Wechsel = החלפה, Geld = כסף: כסף שמחליפים לך = עודף.", "Geld נשמע כמו \"גלד\": המטבעות הקטנים שהתגלדו בכיס אחרי שהחליפו שטר.", "הקופאית מחליפה (wechseln) שטר גדול למטבעות קטנים, וזה ה-Wechselgeld."], "Einkaufswagen": ["Wagen כמו Volkswagen = \"מכונית העם\": Einkaufswagen הוא מכונית קטנה של קניות.", "kaufen ≈ \"קופון\": \"אין קופון אבל יש עגלה\", Ein-kauf-s-wagen.", "תמונה: אתה נוהג בפולקסווגן קטנה בתוך הסופר ומעמיס אליה קניות."], "Rechnung": ["Rechnung ≈ \"רק נאנח\": רק נאנח כשרואים את החשבון.", "rechnen = לחשב, וגם Rechner = מחשבון: Rechnung הוא מה שחושב.", "תמונה: המלצר רוכן אליך (רכן ≈ Rechnung) ומניח חשבון על השולחן."], "Haltestelle": ["halten = לעצור (כמו Halt! = עצור), Stelle = מקום: המקום שבו עוצרים.", "Stelle נשמע כמו \"שתילה\": שותלים את עצמך בתחנה ומחכים לאוטובוס.", "תמונה: צועקים \"הלט!\" והאוטובוס עוצר בדיוק במקום המסומן."], "Termin": ["Termin = Terminator: הטרמינטור קבע לך פגישה מדויקת ולא מאחרים.", "Termin ≈ \"טרם\": צריך להגיע טרם הזמן שנקבע.", "תמונה: הטרמינטור עומד ליד השעון ואומר \"I'll be back, ב-Termin של עשר\"."], "bestellen": ["bestellen ≈ \"בשלן\": מזמינים אוכל מהבשלן.", "be-stellen: שמים הזמנה במקום (Stelle = מקום) והאוכל מגיע.", "באנגלית stall = דוכן: מזמינים מהדוכן."], "brauchen": ["braucht ≈ broke: אני broke, אני צריך כסף.", "\"ברח, אוכל!\": אני צריך אוכל = brauchen.", "brauchen ≈ \"ברוך\": ברוך הבא, מה אתה צריך?"], "Entschuldigung": ["Ent = מורידים, Schuld = אשמה: מורידים את האשמה = סליחה.", "Schuld ≈ \"שולד/חוב\": סולחים על החוב.", "תמונה: אתה מתנגש במישהו ומוריד מעצמך תיק כבד של אשמה, Ent-Schuld-igung."], "Ich hätte gern": ["gern ≈ \"גרגרן\": הגרגרן אומר \"Ich hätte gern עוד אחד!\"", "Ich hätte ≈ \"איך היתה לי\": \"איך היתה לי קפה?\"", "תמונה: גרגרן עומד ליד הדלפק וממלמל \"היתה לי... גרן...\"."], "Wo finde ich": ["Wo נשמע כמו \"וואו\": אתה מסתובב בסופר ואומר \"וואו, איפה...?\"", "finde ≈ find באנגלית: איפה אני find.", "Wo = איפה, finde ≈ \"פיינד\": Where do I find."], "Wie bitte?": ["Wie = איך, bitte = בבקשה: \"איך, בבקשה?\" כשמבקשים שיחזרו.", "\"ווי ביטה\" ≈ \"ווי! ביטה?\": ווי = אוי, וביטה = מה אמרת?", "תמונה: אתה מחזיק יד על האוזן ומתכופף קדימה: Wie bitte?"], "Gern geschehen": ["gern = בשמחה (הגרגרן שמח), geschehen = קרה: \"זה קרה בשמחה\".", "geschehen ≈ \"גשם\": גשם של שמחה יורד עליך.", "\"גרן גשהן\" ≈ \"גרגרן, גש הנה!\": מזמין אותו לקחת עוד."], "Apotheke": ["Apotheke ≈ apothecary באנגלית, בעל בית מרקחת. אותו שורש.", "Apotheke ≈ \"אפ-תיק-ה\": תיק שבו שמים תרופות.", "תמונה: צלב ירוק זוהר ועליו גברת די (die) צועקת \"די לכאב!\""], "Paket": ["Paket ≈ package / packet: אותה מילה, רק קצרה.", "Paket ≈ \"פקט\": אורזים (pack) ועושים \"פקט\" סגור בקופסה.", "תמונה: הדבר (das) הוא החבילה עצמה, עם בול על המצח."], "Fahrkarte": ["Fahr ≈ fare באנגלית: מחיר הנסיעה. Karte = כרטיס. Fahr-karte = כרטיס נסיעה.", "Fahr מגיע מ-fahren = לנסוע (כמו Fahrenheit בלי המעלות).", "תמונה: מנופפים בכרטיס מול הפקח וצועקים \"פאר-קארטה!\""], "Gleis": ["Gleis ≈ glide: הרכבת גולשת על המסילה.", "Gleis ≈ \"גל-אייס\": רכבת מחליקה על קרח (Eis) על המסילה.", "בתחנה בגרמניה תמיד מחפשים \"Gleis 3\" על הלוח, לא רק את שם העיר."], "Verspätung": ["spät = מאוחר (כמו Wie spät ist es?). Ver-spät-ung = להיות מאוחר.", "תמונה: לוח זמנים אדום בתחנה וכתוב עליו \"+25\", זו Verspätung. (קורה הרבה ב-Deutsche Bahn.)", "Verspätung ≈ \"ספא-טונג\": הרכבת נתקעה בספא ואיחרה."], "Öffnungszeiten": ["öffnen = לפתוח, Zeiten = זמנים: זמני הפתיחה.", "כל חנות תולה שלט \"Mo-Fr 9-18\". ביום ראשון (Sonntag) כמעט הכול סגור, תתכוננו.", "תמונה: דלת עם שעון, ומעליה האות Ö כמו פה פתוח."], "Ausweis": ["aus + weisen: להצביע החוצה, להוכיח מי אתה. Ausweis = מה שמוכיח זהות.", "Ausweis ≈ out + wise: מוציאים את הנייר החכם שמוכיח מי אתה.", "תמונה: הברון דר (der) מציג תעודה, ובתמונה רק שפם."], "Briefkasten": ["Brief ≈ brief: מכתב קצר. Kasten = ארגז, ≈ \"קסטה\": תיבה קטנה.", "התיבות של Deutsche Post צהובות: תמונה של תיבה צהובה גדולה על הקיר.", "תמונה: הברון דר (der) דוחף מכתב והשפם נתקע בחריץ."], "Nachbar": ["Nachbar ≈ neighbour באנגלית (nigh + bour). אותה מילה.", "Nachbar ≈ \"נחבר\": השכן שאיתו נתחבר.", "Nach = אחרי, Bar = בר: אחרי הבר תפגוש את השכן."], "abholen": ["ab = מ-, holen = להביא (≈ \"הולן\": הולך להביא). abholen = ללכת וללקחת משם.", "תמונה: הולכים לדואר ואומרים \"הולן!\" ויוצאים עם חבילה.", "ab הולך לסוף: ich hole das Paket ab, כמו הזנב שנשאר מאחור."], "warten": ["warten ≈ wait: אותה מילה כמעט.", "warten ≈ \"ורטן\": מי שמחכה, ורטן.", "מחכים ל-: warten auf. תמונה: מחכים בתחנה ומסתכלים (auf) למעלה על הלוח."], "Kein Problem": ["kein = no, Problem = problem. כמו No problem באנגלית.", "kein נשמע כמו \"אין\": \"אין פרובלם\".", "תמונה: אומרים תודה לקופאית והיא מחייכת ואומרת Kein Problem."], "Das macht nichts": ["macht ≈ make, nichts ≈ nothing: זה לא עושה כלום, לא נורא.", "nichts ≈ \"ניקס\" (nix): אין, כלום.", "תמונה: מישהו מתנצל ושופך קפה, ואתה מנפנף: Das macht nichts."], "Noch einmal, bitte": ["noch ≈ \"נו\": \"נו, עוד פעם!\". einmal = פעם אחת.", "ein-mal: ein = אחד, mal = פעם. עוד פעם אחת.", "תמונה: לא הבנת, מרים אצבע אחת ואומר Noch einmal, bitte."], "mitnehmen": ["mit = עם, nehmen = לקחת: לקחת איתך. (nehmen ≈ \"נא מן\": נא לקחת.)", "בבית קפה אומרים \"Zum Mitnehmen, bitte\" ויוצאים עם הכוס ביד.", "תמונה: אתה לוקח את הכוס ואת העוגה והולך, והמלצר מנופף לך \"ביי!\""], "Achtung": ["Achtung! צועקים \"אחטונג!\" כדי לעצור כולם, ה-ch הוא חיכוך בגרון.", "Achtung = Attention: אותה מילה כמעט.", "תמונה: שלט צהוב במסלול החלקה וכתוב עליו Achtung."], "Von vorne": ["vorne ≈ front: מהחזית, מההתחלה.", "vor = לפני (≈ for/before), vorne = מקדימה.", "תמונה: המאמן מצביע על קו הזינוק וצועק \"Von vorne!\""], "Pause": ["Pause = pause באנגלית, אותה מילה.", "\"פאוזה\": גם בעברית אומרים \"פאוזה\" להפסקה קצרה.", "תמונה: כפתור ‏⏸ בגלגיליות."], "Probe": ["Probe ≈ \"פרובה\": בעברית של תיאטרון \"פרובה\" היא חזרה!", "Probe ≈ prove/probe: בודקים ומנסים.", "תמונה: במאי עם משקפיים אומר \"עוד פרובה\" והשחקנים נאנחים."], "Halle": ["Halle ≈ hall: אולם.", "Halle ≈ \"הללויה\": אולם גדול עם הד.", "תמונה: אולם ריק, נשמעת רק הגלגילית שלך."], "Bühne": ["Bühne ≈ \"בימה\": כמעט אותה מילה בעברית!", "Bühne ≈ \"ביהנה\": אורות על הבמה.", "תמונה: במה אדומה ועליה חתול במגפיים."], "Rollschuhe": ["Roll = roll, Schuhe = shoes: נעליים שמתגלגלות.", "Schuh ≈ shoe: אותו שורש.", "תמונה: נעל ענקית שמתגלגלת בכל האולם."], "Trainer": ["Trainer = trainer: אותה מילה.", "תמונה: משרוקית, שפם ומבט שאומר \"עוד סיבוב\".", "מאמנת = Trainerin: מוסיפים in."], "Kostüm": ["Kostüm = costume: אותה מילה.", "תמונה: תחפושת חתול עם מגפיים וכובע.", "Kostüm ≈ \"קוסטום\": בעברית \"קוסטים\" = תלבושת."], "anfangen": ["an = on, fangen = catch: תופסים את ההתחלה ומתחילים.", "fangen ≈ fang: לוכדים את הרגע.", "תמונה: המאמן שורק, ואתה \"תופס\" את הקו ומתחיל."], "aufhören": ["auf-hören: \"אוף!\" שאומרים כשרוצים שיפסיקו.", "hören = לשמוע: מפסיקים להקשיב ומפסיקים.", "תמונה: המאמן מרים יד: \"Wir hören auf!\" ושורק."], "Ich verstehe nicht": ["verstehen ≈ under-stand: ver-stehen, עומדים \"מתחת\" למשמעות ומבינים.", "stehen = לעמוד. Ich verstehe nicht = אני לא עומד על זה.", "תמונה: מרים כתפיים ואומר Ich verstehe nicht עם חיוך."], "Wie heißt das auf Deutsch?": ["heißen = להיקרא. Wie heißt das? = איך זה נקרא?", "heiß = חם: \"איך החם נקרא?\"", "תמונה: מצביע על גלגילית ושואל Wie heißt das auf Deutsch?"], "Freut mich": ["freuen ≈ friend/Freude: שמחה. \"שמח\" להכיר.", "Freude = שמחה (Ode an die Freude).", "תמונה: לחיצת יד, חיוך ו-Freut mich."], "Toi, toi, toi": ["נשמע כמו \"טפו טפו טפו\": מסורת של \"נגד עין הרע\" לפני במה.", "תמונה: חבר צוות מרוק על כתף השחקן לפני הכניסה לבמה.", "לא אומרים Viel Glück לפני הופעה, אומרים Toi, toi, toi."], "langsam": ["lang = long: מה שלוקח זמן ארוך (long) הוא לאט.", "תמונה: חילזון עם חולצת \"Langsam\" שחוצה את אולם ההחלקה.", "Langsam, bitte! = לאט, בבקשה. אותה מילה שתשמע כשמדברים מהר מדי."], "null": ["null ≈ nullify באנגלית: לבטל, להפוך לאפס.", "תמונה: ביצה גדולה ועגולה על השולחן, והכיתוב \"null\".", "באנגלית null/void = ריק: אין שם כלום."], "eins": ["eins נשמע כמו \"עין\": עין אחת = 1.", "תמונה: ציקלופ עם עין אחת בלבד.", "באנגלית one, בגרמנית eins: מתחילים ב\"איין\" (ein) ומוסיפים s."], "zwei": ["zwei נשמע \"צוואי\" ≈ twin / two: אותו שורש, שניים.", "תמונה: שני תאומים עם חולצות \"zwei\".", "z נהגית \"צ\": צוַי. שני = צוַי."], "drei": ["Dreirad = תלת אופן: drei = 3 גלגלים.", "תמונה: תלת אופן שנוסע ואומר \"drei, drei, drei\".", "drei ≈ three: ה-th הופך ל-d."], "vier": ["vier ≈ \"פיר\": לפיר מעלית יש 4 קירות.", "ב-vier נשמעת f (\"פיר\"), לא v, כמו four באנגלית.", "תמונה: שולחן עם ארבע רגליים וכיתוב \"vier\"."], "fünf": ["fünf ≈ five: אותו מבנה (f-n-f / f-v-e).", "תמונה: יד עם חמש אצבעות וכפפה כתובה \"fünf\".", "ü = \"אוּ\" עם שפתיים מעוגלות: פּוּנף."], "sechs": ["sechs נשמע \"זקס\" ≈ six באנגלית.", "תמונה: קוביית משחק עם 6 נקודות ושלט \"sechs\".", "ch אחרי e נשמעת כ\"ק\": זקס."], "sieben": ["sieben נשמע \"זיבן\" ≈ \"זבנג\": שבע מכות!", "תמונה: שבעה גמדים שאומרים \"זיבן, זיבן\".", "sieben ≈ seven: ה-s נהגית \"ז\"."], "acht": ["acht נשמע \"אחט\" ≈ \"אחת\", אבל זה 8! זה הפוך: \"אחט\" = שמונה.", "Achtung! (שים לב) מתחיל באותה מילה: acht = 8 צעדים בהחלקה.", "תמונה: שמונה (8) בצורת אינסוף שמתנדנד ואומר \"אחט\"."], "neun": ["neun ≈ נאון: 9 נורות נאון בחדר.", "neun ≈ nine: ה-n בהתחלה ובסוף (n-n).", "תמונה: תשע בועות נאון בשלט \"neun\"."], "zehn": ["zehn נשמע \"צן\" ≈ ten: z=צ.", "תמונה: עשר אצבעות של צנון (צן) באוויר.", "zehn ≈ ten: ten + z = zehn."], "elf": ["elf באנגלית = שדון: אחד-עשר שדונים.", "elf נשמע כמו \"אלף\": אחד-עשר אלפים?", "תמונה: קבוצת כדורגל של 11 שדונים (elf)."], "zwölf": ["zwölf נשמע \"צווֹלף\" ≈ Wolf: 12 זאבים!", "תמונה: 12 זאבים מתאספים בחדר.", "zwölf = שנים-עשר, מילה שונה מ-zwei: לא \"zweizehn\"."], "dreizehn": ["dreizehn = drei + zehn = 3 + 10.", "תמונה: שלוש אצבעות ועוד עשר."], "vierzehn": ["vierzehn = vier + zehn = 4 + 10, כמו fourteen באנגלית.", "תמונה: ארבע + עשר גלגלים."], "fünfzehn": ["fünfzehn = fünf + zehn. שימו לב: fünf, לא fünfzehn עם v.", "תמונה: חמישה-עשר פעמונים."], "sechzehn": ["sechzehn: ה-s האחרונה נופלת (לא sechszehn).", "תמונה: שישה-עשר דגלים, אחד נפל."], "siebzehn": ["siebzehn: נופל ה-en מ-sieben (לא siebenzehn).", "תמונה: 17 גמדים, אחד איבד את הכובע (en)."], "achtzehn": ["achtzehn = acht + zehn = 8 + 10. אחרי 18 מותר הרבה דברים.", "תמונה: יום הולדת 18 עם 18 נרות."], "neunzehn": ["neunzehn = neun + zehn = 9 + 10.", "תמונה: תשע-עשרה נורות נאון."], "zwanzig": ["zwanzig = zwei + zig: שני עשרות. -zig ≈ -ty באנגלית.", "תמונה: עשרים שדונים בשני טורים.", "נהגה \"צוואנציג\"."], "dreißig": ["dreißig: במקום drei+zig יש ß: \"דרייסיג\".", "-ßig / -zig = -ty: דרייסיג ≈ thirty.", "תמונה: שלושים נרות על עוגה."], "vierzig": ["vierzig = vier + zig = ארבע עשרות.", "-zig ≈ -ty: \"פירציג\" ≈ forty."], "fünfzig": ["fünfzig = fünf + zig = חמש עשרות.", "תמונה: חמישים סנט של שוקולד."], "hundert": ["hundert ≈ hundred: \"הונדרט\".", "תמונה: מאה כלבים (Hund = כלב!) מתחילים ב-Hund-ert."], "tausend": ["tausend ≈ thousand: \"טאוזנט\".", "תמונה: אלף נמלים מסתובבות בטור.", "הדגש על ה-t: \"טאוּזנט\"."], "Zahl": ["Zahl קשור ל-tell (לספר) ו-zahlen (לשלם): מי שמשלם סופר מספרים.", "תמונה: גברת די (die) סופרת מספרים בקול רם."], "Nummer": ["Nummer ≈ \"נומר\" ≈ נמר: נמר עם מספר על החולצה.", "Nummer ≈ number: אותה מילה כמעט."], "Euro": ["Euro נהגה \"אוֹי-רוֹ\": אוי, כמה זה עולה!", "תמונה: גברת די צועקת \"אוי!\" כשהיא רואה את מחיר היורו."], "Cent": ["Cent נהגה \"צֶנט\" (C=צ). 100 Cent = 1 Euro.", "תמונה: מטבע קטן (\"סנט\") שצועק צ-צ-צנט."], "Uhr": ["Uhr נהגה \"אוּר\" ≈ \"אור\": אור בשעון.", "Es ist drei Uhr = השעה שלוש (לא \"drei Stunden\")."], "Stunde": ["Stunde ≈ סטודנט: הסטודנט יושב שעה בהרצאה.", "Stunde = משך זמן; Uhr = שעה על השעון."], "Minute": ["Minute ≈ minute באנגלית: אותה מילה.", "תמונה: דקה מדיפה (מינוטה) מהדקה."], "Sekunde": ["Sekunde ≈ second באנגלית, ו\"סקונד\" = שנייה.", "תמונה: שנייה קטנה שרצה במעגלי שעון."], "halb": ["halb ≈ half באנגלית: חצי.", "הטריק: halb drei = חצי הדרך אל שלוש = 2:30!", "תמונה: שעון שעומד בחצי הדרך בין שתיים לשלוש."], "Viertel": ["Viertel = vier (ארבע) + tel: חלק מארבע = רבע.", "תמונה: פיצה חתוכה לארבע, וביד אחת Viertel."], "nach": ["nach נהגה \"נאך\": \"נא לחכות אחרי ה...\" = אחרי.", "zehn nach vier = ארבע ועשר (\"עשר אחרי ארבע\")."], "Wie spät ist es?": ["spät ≈ \"שפט\": שופט שמאחר? \"wie spät\" = כמה מאוחר.", "תמונה: שופט מסתכל בשעון ושואל \"wie spät ist es?\"."], "Um wie viel Uhr?": ["um = בשעה, wie viel = כמה, Uhr = שעה: \"בכמה שעה?\"", "תמונה: שעון ענק עם סימן שאלה ושלט \"Um...?\"."], "pünktlich": ["pünktlich ≈ Punkt = נקודה: מגיע בדיוק על הנקודה.", "pünktlich ≈ punctual באנגלית: אותה מילה."], "früh": ["früh ≈ fry: מטגנים ביצה מוקדם בבוקר.", "תמונה: חביתה מתקתקת בשש בבוקר ואומרת \"früh!\"."], "spät": ["spät קשור ל-Verspätung (איחור): בלי Ver- זה \"מאוחר\".", "תמונה: חילזון שמגיע מאוחר ל-spät-ם."], "übermorgen": ["über (מעל) + morgen (מחר) = מעבר למחר = מחרתיים.", "תמונה: גשר (über) שעובר מעל מחר."], "Woche": ["Woche נהגה \"וֹוחֶה\": וואו, עבר שבוע!", "Mittwoch = Mitte (אמצע) der Woche: אמצע השבוע."], "Monat": ["Mond = ירח, Monat = חודש: חודש לפי הירח.", "Monat ≈ month באנגלית: אותה מילה."], "Jahr": ["Jahr נהגה \"יאר\" ≈ year: אותה מילה.", "תמונה: גברת די פותחת יאור עם שנה שלמה על הגב."], "Wochenende": ["Woche (שבוע) + Ende (סוף) = סוף השבוע.", "Das Ende = הסוף, מוכר גם מ\"Ende gut, alles gut\"."], "Vormittag": ["vor (לפני) + Mittag (צהריים) = לפני הצהריים.", "Mittag = Mitte (אמצע) + Tag (יום)."], "Nachmittag": ["nach (אחרי) + Mittag (צהריים) = אחר הצהריים.", "תמונה: שמש יורדת אחרי הצהריים."], "Nacht": ["Nacht נהגה \"נאחט\" ≈ night: אותה מילה.", "Nacht ≈ \"נחת\": בלילה נוחתים לישון."], "Datum": ["date באנגלית = תמר וגם תאריך: Datum = תאריך.", "תמונה: תמר ענק עם תאריך מודפס עליו."], "Wochentag": ["Woche (שבוע) + Tag (יום) = יום בשבוע.", "תמונה: לוח ובו שבעה ימים והכיתוב Wochentag."], "Welcher Tag ist heute?": ["Welcher = איזה: \"ולכר\" = איזה? כמו welcher Tag.", "תשובה: Heute ist Montag. Montag = יום שני."], "Der Wievielte ist heute?": ["Wie viel + te: \"הכמה?\" כמו בעברית \"כמה בחודש?\".", "תשובה: Der dritte. כמו \"היום השלישי\"."], "jeden Tag": ["jeden ≈ \"ידן\": כל, every.", "תמונה: יד (ידן) שמסמנת וי כל יום בלוח."], "nächste Woche": ["nächste ≈ next: nächste Woche = next week.", "תמונה: חץ שמצביע על השבוע הבא בלוח."], "letzte Woche": ["letzte ≈ last: letzte Woche = last week.", "תמונה: דף לוח שנה שנקרע, הדף האחרון."], "Geburtstag": ["Geburt (לידה) + Tag (יום) = יום הולדת.", "Geburt ≈ \"גבורה\": ביום ההולדת חוגגים את גבורת החיים."], "Feiertag": ["Feier (חגיגה) + Tag (יום) = יום חג.", "Feier ≈ \"פייר\": חוגגים בפייר פליי."], "Montag": ["Mond = ירח: Montag = יום הירח (Monday).", "Montag ≈ Monday: אותה מילה כמעט."], "Dienstag": ["Dienst = שירות: יום שלישי = יום שירות.", "נהגה \"דינסטאג\": דין וחשבון ביום שלישי."], "Mittwoch": ["Mitte (אמצע) + Woche (שבוע) = אמצע השבוע.", "תמונה: חץ באמצע לוח השבוע על יום רביעי."], "Donnerstag": ["Donner = רעם: Donnerstag = יום הרעם (Thor).", "תמונה: רעם גדול בענן ביום חמישי."], "Freitag": ["frei = חופשי: Freitag = סוף השבוע החופשי מתחיל.", "Freitag ≈ Friday."], "Samstag": ["Samstag ≈ \"שבת\" (Sabbat): בא מ\"שבת\"!", "נהגה \"זמסטאג\": שבת, שבת."], "Sonntag": ["Sonne = שמש: Sonntag = יום השמש (Sunday).", "תמונה: שמש ענקית על שמיים פרוסים ביום ראשון."], "Januar": ["Januar = ינואר: קרוב כמעט לאותה מילה (\"יאנואר\").", "נכתב עם J ונהגה Y: \"יאנואר\"."], "Februar": ["Februar = פברואר: \"פברואר\".", "ה-u נשמעת: פֶּבְּרוּאָר."], "März": ["März = מרץ: קרוב כמעט אחד לאחד! \"מֶרְץ\".", "תמונה: חצי-מרץ (חץ) מתחיל את האביב. ä = אֶ."], "April": ["Apri     function open() { css(); if (ov) ov.remove(); build(); ov = document.createElement('div'); ov.className = 'wp-ov'; document.body.appendChild(ov); render(); }
    function close() { stopClock(); try { if (wake) wake.release(); } catch (e) {} wake = null; if (ov) { ov.remove(); ov = null; } try { refreshDailyBanner(); } catch (e) {} }
    window.openWrittenPractice = open; window.writtenStatusText = statusText;
    window.WrittenPractice = { open: open, _state: function () { return S; }, streak: streak };
  })();
  // <<DAILYADAPT-END>>

  // --- full progress backup: copy a code from one place, paste it in another ---
  (function () {
    const ex = document.getElementById('allExportBtn');
    const im = document.getElementById('allImportBtn');
    const panel = document.getElementById('allBackupPanel');
    if (!ex || !im || !panel) return;
    const isMine = k => k && k.indexOf('delearn_') === 0 && k.indexOf('delearn_kater_') !== 0;
    ex.addEventListener('click', () => {
      panel.style.display = 'block';
      const data = {};
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (isMine(k)) data[k] = localStorage.getItem(k);
        }
      } catch (e) {}
      if (!Object.keys(data).length) { panel.innerHTML = '<div class="voice-note">אין עדיין התקדמות שמורה.</div>'; return; }
      panel.innerHTML = '<div class="voice-note">' + Object.keys(data).length + ' פריטים. העתיקו והדביקו באפליקציה החדשה (הגדרות ← הדבקת קוד).</div><textarea class="note-input" id="allBackupArea" style="min-height:120px;" readonly>' + escapeHtml(JSON.stringify(data)) + '</textarea><button class="note-save-btn" id="allBackupCopy">העתק</button>';
      document.getElementById('allBackupCopy').addEventListener('click', () => {
        const area = document.getElementById('allBackupArea');
        area.select();
        let ok = false;
        try { navigator.clipboard.writeText(area.value); ok = true; } catch (e) {}
        if (!ok) { try { document.execCommand('copy'); ok = true; } catch (e) {} }
        document.getElementById('allBackupCopy').textContent = ok ? 'הועתק!' : 'סמן והעתק ידנית';
      });
    });
    im.addEventListener('click', () => {
      panel.style.display = 'block';
      panel.innerHTML = '<textarea class="note-input" id="allImportArea" style="min-height:120px;" placeholder="הדביקו כאן את הקוד שהעתקתם"></textarea><button class="note-save-btn" id="allImportGo">ייבוא</button><div class="voice-note" id="allImportMsg"></div>';
      document.getElementById('allImportGo').addEventListener('click', () => {
        const msg = document.getElementById('allImportMsg');
        try {
          const data = JSON.parse(document.getElementById('allImportArea').value);
          let n = 0;
          Object.keys(data).forEach(k => { if (isMine(k) && typeof data[k] === 'string') { try { localStorage.setItem(k, data[k]); n++; } catch (e) {} } });
          msg.textContent = n ? 'יובאו ' + n + ' פריטים. טוען מחדש…' : 'לא נמצא מה לייבא בקוד הזה.';
          if (n) setTimeout(() => location.reload(), 900);
        } catch (e) { msg.textContent = 'הקוד לא תקין — העתיקו אותו שוב במלואו.'; }
      });
    });
  })();

</script>
